<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#f5f1eb">
<meta name="description" content="《不开玩笑》播客随机收听机">
<title>不开玩笑 · 随机收听机</title>
<style>
:root{--paper:#f6f2ec;--cream:#f7ead2;--ink:#33231a;--brown:#5c3827;--brown-dark:#352016;--gold:#bb8448}*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;overscroll-behavior:none;touch-action:manipulation;background:radial-gradient(circle at 50% 12%,rgba(255,255,255,.95),transparent 45%),linear-gradient(180deg,#f8f5f0,#eee8e0);color:var(--ink);font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif}button,a{font:inherit;-webkit-tap-highlight-color:transparent}.app{width:100%;height:100svh;display:grid;place-items:center;padding:max(8px,env(safe-area-inset-top)) 4px max(8px,env(safe-area-inset-bottom));overflow:hidden}.machine-wrap{position:relative;width:min(98vw,calc(97svh * .75));aspect-ratio:3/4;container-type:inline-size;filter:drop-shadow(0 22px 30px rgba(69,43,27,.16));user-select:none}.machine-art{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none}.reel{position:absolute;top:40.72%;width:15.65%;height:21.48%;overflow:hidden;border-radius:7%/4%;background:linear-gradient(90deg,rgba(79,47,27,.08),transparent 20% 80%,rgba(79,47,27,.08)),linear-gradient(180deg,#f7ead1,#e9d2a9 47%,#f9efd9 53%,#e6cda4);box-shadow:inset 0 10px 16px rgba(75,44,23,.15),inset 0 -10px 16px rgba(75,44,23,.16),0 0 0 1px rgba(89,53,28,.16);z-index:3}.reel.r1{left:20.35%}.reel.r2{left:40.52%}.reel.r3{left:60.69%}.reel:before,.reel:after{content:"";position:absolute;z-index:5;left:0;right:0;height:20%;pointer-events:none}.reel:before{top:0;background:linear-gradient(rgba(74,42,20,.28),transparent)}.reel:after{bottom:0;background:linear-gradient(transparent,rgba(74,42,20,.28))}.reel-strip{position:absolute;inset:0 0 auto 0;height:100%;transform:translateY(0);will-change:transform}.digit{height:100%;display:grid;place-items:center;color:#38261d;font-family:Georgia,"Times New Roman",serif;font-size:10.7cqw;font-weight:500;line-height:1;text-shadow:0 2px 0 rgba(255,255,255,.68)}.spin-button{position:absolute;z-index:8;left:30.25%;top:68.55%;width:34.55%;height:13.15%;border:0;border-radius:999px;background:transparent;color:#fff4e1;font-family:"STSong","SimSun",serif;font-size:4.65cqw;letter-spacing:.12em;padding-left:.12em;font-weight:700;text-shadow:0 2px 5px rgba(24,12,7,.58);cursor:pointer;transition:transform .12s,filter .16s}.spin-button:after{content:"";position:absolute;inset:10% 7%;border-radius:inherit;background:linear-gradient(180deg,rgba(255,255,255,.10),transparent 45%);opacity:.35;pointer-events:none}.spin-button:active,.spin-button.pressed{transform:translateY(1.2cqw) scale(.985);filter:brightness(.92)}.spin-button:disabled{cursor:wait}.handle-hit{position:absolute;z-index:9;right:0;top:27.5%;width:17%;height:34%;border:0;background:transparent;cursor:pointer}.handle-hit:after{content:"";position:absolute;right:2%;top:4%;width:7.5cqw;height:7.5cqw;border-radius:50%;border:1px solid transparent;opacity:0}.handle-hit.pulled:after{animation:handlePulse .68s ease-out}@keyframes handlePulse{0%{opacity:.8;transform:scale(.7);border-color:rgba(255,224,168,.95);box-shadow:0 0 0 0 rgba(199,137,66,.45)}100%{opacity:0;transform:scale(1.65);border-color:rgba(255,224,168,0);box-shadow:0 0 0 2.5cqw rgba(199,137,66,0)}}.status{position:absolute;z-index:7;left:50%;bottom:2.7%;transform:translateX(-50%);padding:.7cqw 2.2cqw;border-radius:999px;color:rgba(78,50,34,.7);background:rgba(255,250,241,.76);border:1px solid rgba(158,111,62,.18);font-size:2.25cqw;letter-spacing:.05em;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}.status.show{opacity:1}.modal{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:18px;background:rgba(37,26,20,.46);backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px);opacity:0;visibility:hidden;transition:opacity .24s,visibility .24s}.modal.open{opacity:1;visibility:visible}.card{width:min(92vw,410px);max-height:88svh;position:relative;padding:24px 21px 20px;border-radius:25px;background:linear-gradient(165deg,#fffdfa,#f4ede4);border:1px solid rgba(134,91,52,.18);box-shadow:0 28px 72px rgba(42,25,15,.27);transform:translateY(18px) scale(.96);transition:transform .28s cubic-bezier(.18,.82,.32,1.08);overflow:hidden}.modal.open .card{transform:none}.close{position:absolute;right:13px;top:13px;width:36px;height:36px;display:grid;place-items:center;border:1px solid rgba(109,77,54,.18);border-radius:50%;background:rgba(255,255,255,.66);color:#a09084;font-size:25px}.result-kicker{text-align:center;color:#a8753d;font-family:"STSong","SimSun",serif;font-size:17px;letter-spacing:.16em}.result-ep{margin:7px 0 17px;text-align:center;color:#80552f;font-family:Georgia,"STSong",serif;font-size:38px;line-height:1;font-weight:700}.result-title{margin:0;padding:17px 2px;border-top:1px solid rgba(143,101,62,.15);border-bottom:1px solid rgba(143,101,62,.15);font-family:"STSong","SimSun",serif;font-size:clamp(22px,6.3vw,30px);line-height:1.36;text-align:center;color:#31231a}.hosts{margin:17px 0 0;color:#4e3a2d;font-size:15px;line-height:1.65;text-align:center}.meta{margin:15px 0 18px;display:flex;justify-content:center;gap:8px;flex-wrap:wrap}.meta span{padding:7px 10px;border-radius:999px;background:#eee5d9;color:#7a6758;font-size:12px}.actions{display:grid;grid-template-columns:1fr 1.45fr;gap:10px}.actions button,.actions a{min-height:50px;border-radius:14px;display:grid;place-items:center;text-decoration:none;font-weight:700;border:1px solid rgba(92,58,37,.17)}.again{color:#513a2b;background:#eee3d4}.listen{color:#fff6e7;background:linear-gradient(180deg,#6b4632,#3f291f);box-shadow:0 5px 12px rgba(52,31,20,.18)}.error{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:60;padding:9px 14px;border-radius:999px;color:#fff4e2;background:#55372a;font-size:12px;opacity:0;pointer-events:none;transition:.2s;white-space:nowrap}.error.show{opacity:1}@media(max-height:620px){.machine-wrap{width:min(90vw,calc(94svh * .75))}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<main class="app" aria-label="不开玩笑随机收听机"><section class="machine-wrap" id="machine"><img class="machine-art" id="machineArt" alt="猫头鹰复古机械老虎机"><div class="reel r1"><div class="reel-strip"></div></div><div class="reel r2"><div class="reel-strip"></div></div><div class="reel r3"><div class="reel-strip"></div></div><button class="spin-button" id="spinButton" type="button">开始随机</button><button class="handle-hit" id="handleButton" type="button" aria-label="拉动摇杆"></button><div class="status" id="status">正在寻找一期节目…</div></section></main>
<section class="modal" id="resultModal" role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="resultTitle"><article class="card"><button class="close" id="closeButton" type="button" aria-label="关闭">×</button><div class="result-kicker">本次随机收听</div><div class="result-ep" id="resultEpisode">第 001 期</div><h2 class="result-title" id="resultTitle"></h2><p class="hosts" id="resultHosts"></p><div class="meta"><span id="resultDuration"></span><span id="resultDate"></span><span id="resultPlays"></span></div><div class="actions"><button class="again" id="againButton" type="button">再抽一期</button><a class="listen" id="listenButton" href="#" target="_blank" rel="noopener noreferrer">去小宇宙收听</a></div></article></section><div class="error" id="errorToast"></div>
<script src="./machine-part-1.js"></script><script src="./machine-part-2.js"></script><script src="./machine-part-3.js"></script><script src="./machine-part-4.js"></script><script src="./episodes-init.js"></script><script src="./episodes-1.js"></script><script src="./episodes-2.js"></script><script src="./episodes-3.js"></script><script src="./episodes-4.js"></script><script src="./episodes-5.js"></script><script src="./episodes-6.js"></script>
<script>(()=>{"use strict";const art=document.getElementById("machineArt"),parts=Array.isArray(window.MACHINE_ART_PARTS)?window.MACHINE_ART_PARTS:[];if(parts.length===4){art.src="data:image/webp;base64,"+parts.join("")}else{console.error("机身贴图分片加载失败",parts.length)}const reels=[...document.querySelectorAll(".reel")],spinButton=document.getElementById("spinButton"),handleButton=document.getElementById("handleButton"),status=document.getElementById("status"),modal=document.getElementById("resultModal"),closeButton=document.getElementById("closeButton"),againButton=document.getElementById("againButton"),listenButton=document.getElementById("listenButton"),errorToast=document.getElementById("errorToast");let spinning=false,lastEpisode=null,audioCtx=null;const allEpisodes=(Array.isArray(window.EPISODES)?window.EPISODES:[]).filter(item=>Number.isInteger(Number(item.episode))&&Number(item.episode)>=1&&Number(item.episode)<=251).sort((a,b)=>Number(a.episode)-Number(b.episode));function showError(message){errorToast.textContent=message;errorToast.classList.add("show");clearTimeout(showError.timer);showError.timer=setTimeout(()=>errorToast.classList.remove("show"),2200)}function syncDigitHeights(reel){const h=reel.clientHeight;reel.querySelectorAll(".digit").forEach(node=>node.style.height=`${h}px`)}function buildReels(){reels.forEach(reel=>{const strip=reel.querySelector(".reel-strip"),numbers=[];for(let cycle=0;cycle<12;cycle++){for(let n=0;n<10;n++)numbers.push(n)}strip.innerHTML=numbers.map(n=>`<div class="digit">${n}</div>`).join("");strip.dataset.digit="0";requestAnimationFrame(()=>{syncDigitHeights(reel);positionReel(reel,0,false)})})}function positionReel(reel,index,animate=false,duration=1e3){const strip=reel.querySelector(".reel-strip"),h=reel.clientHeight;strip.style.transition=animate?`transform ${duration}ms cubic-bezier(.12,.72,.16,1)`:"none";strip.style.transform=`translate3d(0,${-index*h}px,0)`}function clickSound(freq=280,duration=.045,volume=.018){try{audioCtx||=new(window.AudioContext||window.webkitAudioContext);const osc=audioCtx.createOscillator(),gain=audioCtx.createGain();osc.type="triangle";osc.frequency.value=freq;gain.gain.setValueAtTime(volume,audioCtx.currentTime);gain.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+duration);osc.connect(gain).connect(audioCtx.destination);osc.start();osc.stop(audioCtx.currentTime+duration)}catch(_e){}}function winSound(){[392,523,659].forEach((f,i)=>setTimeout(()=>clickSound(f,.13,.035),i*95))}function chooseEpisode(){if(!allEpisodes.length)return null;let item;do{item=allEpisodes[Math.floor(Math.random()*allEpisodes.length)]}while(allEpisodes.length>1&&Number(item.episode)===lastEpisode);lastEpisode=Number(item.episode);return item}function formatPlays(value){const n=Number(value||0);if(!n)return"";if(n>=1e4)return`${(n/1e4).toFixed(n>=1e5?0:1)}万播放`;return`${n.toLocaleString("zh-CN")}播放`}function openResult(item){const ep=String(item.episode).padStart(3,"0");document.getElementById("resultEpisode").textContent=`第 ${ep} 期`;document.getElementById("resultTitle").textContent=item.title||"未命名节目";document.getElementById("resultHosts").textContent=`主播：${item.hosts||"未标注"}`;document.getElementById("resultDuration").textContent=item.duration?`时长 ${item.duration}`:"";document.getElementById("resultDate").textContent=item.date||"";document.getElementById("resultPlays").textContent=formatPlays(item.plays);listenButton.href=item.url||"#";listenButton.style.display=item.url?"grid":"none";modal.classList.add("open");modal.setAttribute("aria-hidden","false");closeButton.focus({preventScroll:true})}function closeResult(){modal.classList.remove("open");modal.setAttribute("aria-hidden","true")}async function spin(){if(spinning)return;const item=chooseEpisode();if(!item){showError("节目数据加载失败，请刷新后重试");return}spinning=true;spinButton.disabled=true;spinButton.classList.add("pressed");handleButton.classList.remove("pulled");void handleButton.offsetWidth;handleButton.classList.add("pulled");status.classList.add("show");const digits=String(item.episode).padStart(3,"0").split("").map(Number),durations=[920,1210,1510];reels.forEach((reel,i)=>{const current=Number(reel.querySelector(".reel-strip").dataset.digit||0),target=90+digits[i];positionReel(reel,current,false);void reel.offsetWidth;positionReel(reel,target,true,durations[i]);let ticks=0;const timer=setInterval(()=>{clickSound(210+i*45,.025,.012);if(++ticks>12+i*4)clearInterval(timer)},68+i*13)});await new Promise(resolve=>setTimeout(resolve,durations[2]+110));reels.forEach((reel,i)=>{const strip=reel.querySelector(".reel-strip");strip.dataset.digit=String(digits[i]);positionReel(reel,digits[i],false)});status.classList.remove("show");spinButton.classList.remove("pressed");spinButton.disabled=false;spinning=false;winSound();setTimeout(()=>openResult(item),150)}spinButton.addEventListener("click",spin);handleButton.addEventListener("click",spin);closeButton.addEventListener("click",closeResult);againButton.addEventListener("click",()=>{closeResult();setTimeout(spin,150)});modal.addEventListener("click",event=>{if(event.target===modal)closeResult()});document.addEventListener("keydown",event=>{if(event.key==="Escape")closeResult()});window.addEventListener("resize",()=>{reels.forEach(reel=>{syncDigitHeights(reel);const d=Number(reel.querySelector(".reel-strip").dataset.digit||0);positionReel(reel,d,false)})});buildReels();if(allEpisodes.length!==251)console.warn(`节目数据数量异常：${allEpisodes.length}`)})();</script>
</body></html>

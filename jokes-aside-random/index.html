  <script>
    (()=>{"use strict";const episodes=(Array.isArray(window.EPISODES)?window.EPISODES:[]).filter(x=>Number.isInteger(+x.episode)&&+x.episode>=1&&+x.episode<=251);const machine=document.getElementById("machine"),reels=[...document.querySelectorAll(".reel")],spinButton=document.getElementById("spin"),lever=document.getElementById("lever"),dial=document.getElementById("dial"),status=document.getElementById("status"),overlay=document.getElementById("overlay"),close=document.getElementById("close"),again=document.getElementById("again"),listen=document.getElementById("listen");let spinning=false,timer=null,last=null,audio=null;const pad=n=>String(n).padStart(3,"0");function tick(strong=false){try{audio||=new(window.AudioContext||window.webkitAudioContext);const o=audio.createOscillator(),g=audio.createGain();o.type="square";o.frequency.value=strong?142:96;g.gain.setValueAtTime(strong?.032:.014,audio.currentTime);g.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+(strong?.1:.03));o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+(strong?.1:.03))}catch(_){}}function closeResult(){overlay.classList.remove("open");overlay.setAttribute("aria-hidden","true")}function openResult(item){document.getElementById("episode").textContent=pad(item.episode);document.getElementById("title").textContent=item.title;document.getElementById("hosts").textContent=item.hosts||"—";document.getElementById("date").textContent=item.date||"—";document.getElementById("duration").textContent=item.duration||"—";document.getElementById("plays").textContent=item.plays?Number(item.plays).toLocaleString("zh-CN"):"—";listen.href=item.url;overlay.classList.add("open");overlay.setAttribute("aria-hidden","false");close.focus({preventScroll:true})}function choose(){if(!episodes.length)return null;let item;do item=episodes[Math.floor(Math.random()*episodes.length)];while(episodes.length>1&&item.episode===last);last=item.episode;return item}function spin(){if(spinning)return;cons

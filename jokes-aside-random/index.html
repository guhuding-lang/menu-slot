<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#f1e6d8">
<meta name="description" content="《不开玩笑》播客随机收听机">
<title>不开玩笑 · 随机收听机</title>
<link rel="icon" href="./favicon.svg" type="image/svg+xml">
<link rel="preload" href="./machine-art-v8.svg" as="image">
<style>
:root{--paper:#f1e6d8;--deep:#e4d6c4;--ink:#33231a;--gold:#b98745}*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;overscroll-behavior:none;touch-action:manipulation;background:radial-gradient(circle at 50% 9%,rgba(255,255,255,.62),transparent 38%),linear-gradient(180deg,var(--paper),var(--deep));color:var(--ink);font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif}button,a{font:inherit;-webkit-tap-highlight-color:transparent}.app{width:100%;height:100dvh;display:grid;place-items:center;padding:max(8px,env(safe-area-inset-top)) 4px max(8px,env(safe-area-inset-bottom));overflow:hidden}.machine{position:relative;width:min(100vw,calc(98dvh*.667));aspect-ratio:1024/1536;container-type:inline-size;filter:drop-shadow(0 24px 28px rgba(62,38,24,.18));user-select:none}.machine-art{position:absolute;inset:0;width:100%;height:100%;display:block;object-fit:contain;pointer-events:none}.reel{position:absolute;top:42%;width:17.2%;height:24%;overflow:hidden;border-radius:7%/4%;background:linear-gradient(90deg,rgba(73,43,24,.16),transparent 18% 82%,rgba(73,43,24,.16)),linear-gradient(180deg,#f7edda,#e6cfaa 47%,#fff5df 51%,#ddc197);box-shadow:inset 0 14px 19px rgba(70,40,20,.2),inset 0 -14px 19px rgba(70,40,20,.22),0 0 0 1px rgba(95,58,30,.2);z-index:3}.reel-one{left:22.2%}.reel-two{left:41.35%}.reel-three{left:60.55%}.reel:before,.reel:after{content:"";position:absolute;z-index:5;left:0;right:0;height:24%;pointer-events:none}.reel:before{top:0;background:linear-gradient(rgba(69,41,22,.34),transparent)}.reel:after{bottom:0;background:linear-gradient(transparent,rgba(69,41,22,.34))}.reel-strip{position:absolute;inset:0 0 auto;height:100%;transform:translate3d(0,0,0);will-change:transform}.digit{height:100%;display:grid;place-items:center;color:#2d2119;font-family:Georgia,"Times New Roman",serif;font-size:13.4cqw;font-weight:700;line-height:1;text-shadow:0 2px 0 rgba(255,255,255,.72)}.spin-button{position:absolute;z-index:8;left:26%;top:79.4%;width:48%;height:7.3%;border:0;border-radius:999px;background:rgba(44,29,21,.08);color:#fff1d7;font-family:"STSong","SimSun",serif;font-size:5.25cqw;font-weight:800;letter-spacing:.14em;padding-left:.14em;text-shadow:0 2px 7px rgba(20,10,5,.72);cursor:pointer;transition:transform .14s,filter .16s}.spin-button:active,.spin-button.pressed{transform:translateY(1.1cqw) scale(.985);filter:brightness(.9)}.spin-button:disabled{cursor:wait}.handle-hit{position:absolute;z-index:9;right:1%;top:34%;width:14.5%;height:31%;border:0;background:transparent;cursor:pointer;transform-origin:48% 78%}.handle-hit.pulled{animation:leverPull .62s cubic-bezier(.2,.72,.2,1)}.handle-hit:after{content:"";position:absolute;right:14%;top:0;width:8cqw;height:8cqw;border-radius:50%;border:1px solid transparent;opacity:0}.handle-hit.pulled:after{animation:handlePulse .68s ease-out}@keyframes leverPull{45%{transform:translateY(5.5cqw) rotate(8deg)}}@keyframes handlePulse{0%{opacity:.85;transform:scale(.7);border-color:rgba(255,225,170,.95);box-shadow:0 0 0 0 rgba(185,135,69,.42)}100%{opacity:0;transform:scale(1.65);border-color:rgba(255,225,170,0);box-shadow:0 0 0 2.5cqw rgba(185,135,69,0)}}.status{position:absolute;z-index:7;left:50%;bottom:2.2%;transform:translateX(-50%);padding:.7cqw 2.4cqw;border-radius:999px;color:rgba(72,50,36,.74);background:rgba(255,250,241,.78);border:1px solid rgba(150,105,61,.2);font-size:2.5cqw;letter-spacing:.05em;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}.status.show{opacity:1}.modal{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:18px;background:rgba(39,27,20,.46);backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px);opacity:0;visibility:hidden;transition:opacity .24s,visibility .24s}.modal.open{opacity:1;visibility:visible}.result-card{width:min(92vw,410px);max-height:88svh;position:relative;padding:24px 21px 20px;border-radius:24px;background:linear-gradient(165deg,#fffdfa,#f2eadf);border:1px solid rgba(132,91,54,.2);box-shadow:0 28px 72px rgba(42,25,15,.27);transform:translateY(18px) scale(.96);transition:transform .28s cubic-bezier(.18,.82,.32,1.08);overflow:hidden}.modal.open .result-card{transform:none}.close{position:absolute;right:13px;top:13px;width:36px;height:36px;display:grid;place-items:center;border:1px solid rgba(109,77,54,.18);border-radius:50%;background:rgba(255,255,255,.66);color:#99877b;font-size:25px}.result-kicker{text-align:center;color:#a8753d;font-family:"STSong","SimSun",serif;font-size:17px;letter-spacing:.16em}.result-episode{margin:7px 0 17px;text-align:center;color:#80552f;font-family:Georgia,"STSong",serif;font-size:38px;line-height:1;font-weight:700}.result-title{margin:0;padding:17px 2px;border-top:1px solid rgba(143,101,62,.15);border-bottom:1px solid rgba(143,101,62,.15);font-family:"STSong","SimSun",serif;font-size:clamp(22px,6.3vw,30px);line-height:1.36;text-align:center;color:#31231a}.result-hosts{margin:17px 0 0;color:#4e3a2d;font-size:15px;line-height:1.65;text-align:center}.result-meta{margin:15px 0 18px;display:flex;justify-content:center;gap:8px;flex-wrap:wrap}.result-meta span{min-height:29px;padding:7px 10px;border-radius:999px;background:#eee5d9;color:#7a6758;font-size:12px}.result-meta span:empty{display:none}.actions{display:grid;grid-template-columns:1fr 1.45fr;gap:10px}.actions button,.actions a{min-height:50px;border-radius:14px;display:grid;place-items:center;text-decoration:none;font-weight:700;border:1px solid rgba(92,58,37,.17)}.again{color:#513a2b;background:#eee3d4}.listen{color:#fff6e7;background:linear-gradient(180deg,#6b4632,#3f291f);box-shadow:0 5px 12px rgba(52,31,20,.18)}.toast{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:60;padding:9px 14px;border-radius:999px;color:#fff4e2;background:#55372a;font-size:12px;opacity:0;pointer-events:none;transition:opacity .2s;white-space:nowrap}.toast.show{opacity:1}@media(max-height:690px){.machine{width:min(100vw,calc(96dvh*.667))}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<main class="app" aria-label="不开玩笑随机收听机"><section class="machine" id="machine"><img class="machine-art" src="./machine-art-v8.svg" alt="猫头鹰老虎机模型"><div class="reel reel-one"><div class="reel-strip"></div></div><div class="reel reel-two"><div class="reel-strip"></div></div><div class="reel reel-three"><div class="reel-strip"></div></div><button class="spin-button" id="spinButton" type="button">开始随机</button><button class="handle-hit" id="handleButton" type="button" aria-label="拉动摇杆"></button><div class="status" id="status">正在寻找一期节目...</div></section></main>
<section class="modal" id="resultModal" role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="resultTitle"><article class="result-card"><button class="close" id="closeButton" type="button" aria-label="关闭">×</button><div class="result-kicker">本次随机收听</div><div class="result-episode" id="resultEpisode">第 001 期</div><h2 class="result-title" id="resultTitle"></h2><p class="result-hosts" id="resultHosts"></p><div class="result-meta"><span id="resultDuration"></span><span id="resultDate"></span><span id="resultPlays"></span></div><div class="actions"><button class="again" id="againButton" type="button">再抽一期</button><a class="listen" id="listenButton" href="#" target="_blank" rel="noopener noreferrer">去小宇宙收听</a></div></article></section><div class="toast" id="toast"></div>
<script src="./episodes-init.js"></script><script src="./episodes-1.js"></script><script src="./episodes-2.js"></script><script src="./episodes-3.js"></script><script src="./episodes-4.js"></script><script src="./episodes-5.js"></script><script src="./episodes-6.js"></script>
<script>(()=>{"use strict";const reels=[...document.querySelectorAll(".reel")],spinButton=document.getElementById("spinButton"),handleButton=document.getElementById("handleButton"),status=document.getElementById("status"),modal=document.getElementById("resultModal"),closeButton=document.getElementById("closeButton"),againButton=document.getElementById("againButton"),listenButton=document.getElementById("listenButton"),toast=document.getElementById("toast");let spinning=false,lastEpisode=null,audioContext=null;const episodes=(Array.isArray(window.EPISODES)?window.EPISODES:[]).filter(item=>Number.isInteger(Number(item.episode))&&Number(item.episode)>=1&&Number(item.episode)<=251).sort((a,b)=>Number(a.episode)-Number(b.episode));function showToast(message){toast.textContent=message;toast.classList.add("show");clearTimeout(showToast.timer);showToast.timer=setTimeout(()=>toast.classList.remove("show"),2200)}function syncDigitHeights(reel){const height=reel.clientHeight;reel.querySelectorAll(".digit").forEach(node=>{node.style.height=`${height}px`})}function buildReels(){reels.forEach(reel=>{const strip=reel.querySelector(".reel-strip"),values=[];for(let cycle=0;cycle<12;cycle+=1){for(let digit=0;digit<=9;digit+=1)values.push(digit)}strip.innerHTML=values.map(value=>`<div class="digit">${value}</div>`).join("");strip.dataset.digit="0";requestAnimationFrame(()=>{syncDigitHeights(reel);positionReel(reel,0,false)})})}function positionReel(reel,index,animate=false,duration=1000){const strip=reel.querySelector(".reel-strip"),height=reel.clientHeight;strip.style.transition=animate?`transform ${duration}ms cubic-bezier(.12,.72,.16,1)`:"none";strip.style.transform=`translate3d(0,${-index*height}px,0)`}function playTick(freq=280,duration=.045,volume=.018){try{audioContext||=new(window.AudioContext||window.webkitAudioContext);const osc=audioContext.createOscillator(),gain=audioContext.createGain();osc.type="triangle";osc.frequency.value=freq;gain.gain.setValueAtTime(volume,audioContext.currentTime);gain.gain.exponentialRampToValueAtTime(.0001,audioContext.currentTime+duration);osc.connect(gain).connect(audioContext.destination);osc.start();osc.stop(audioContext.currentTime+duration)}catch(_error){}}function playWin(){[392,523,659].forEach((freq,index)=>{setTimeout(()=>playTick(freq,.13,.035),index*95)})}function chooseEpisode(){if(!episodes.length)return null;let item;do{item=episodes[Math.floor(Math.random()*episodes.length)]}while(episodes.length>1&&Number(item.episode)===lastEpisode);lastEpisode=Number(item.episode);return item}function formatPlays(value){const number=Number(value||0);if(!number)return"";if(number>=10000)return`${(number/10000).toFixed(number>=100000?0:1)}万播放`;return`${number.toLocaleString("zh-CN")}播放`}function openResult(item){const episode=String(item.episode).padStart(3,"0");document.getElementById("resultEpisode").textContent=`第 ${episode} 期`;document.getElementById("resultTitle").textContent=item.title||"未命名节目";document.getElementById("resultHosts").textContent=`主播：${item.hosts||"未标注"}`;document.getElementById("resultDuration").textContent=item.duration?`时长 ${item.duration}`:"";document.getElementById("resultDate").textContent=item.date||"";document.getElementById("resultPlays").textContent=formatPlays(item.plays);listenButton.href=item.url||"#";listenButton.style.display=item.url?"grid":"none";modal.classList.add("open");modal.setAttribute("aria-hidden","false");closeButton.focus({preventScroll:true})}function closeResult(){modal.classList.remove("open");modal.setAttribute("aria-hidden","true")}async function spin(){if(spinning)return;const item=chooseEpisode();if(!item){showToast("节目数据加载失败，请刷新后重试");return}spinning=true;spinButton.disabled=true;spinButton.classList.add("pressed");handleButton.classList.remove("pulled");void handleButton.offsetWidth;handleButton.classList.add("pulled");status.classList.add("show");const digits=String(item.episode).padStart(3,"0").split("").map(Number),durations=[980,1280,1600];reels.forEach((reel,index)=>{const strip=reel.querySelector(".reel-strip"),currentDigit=Number(strip.dataset.digit||0),target=90+digits[index];positionReel(reel,currentDigit,false);void reel.offsetWidth;positionReel(reel,target,true,durations[index]);let ticks=0;const tickTimer=setInterval(()=>{playTick(210+index*45,.025,.012);ticks+=1;if(ticks>12+index*4)clearInterval(tickTimer)},68+index*13)});await new Promise(resolve=>setTimeout(resolve,durations[2]+110));reels.forEach((reel,index)=>{const strip=reel.querySelector(".reel-strip");strip.dataset.digit=String(digits[index]);positionReel(reel,digits[index],false)});status.classList.remove("show");spinButton.classList.remove("pressed");spinButton.disabled=false;spinning=false;playWin();setTimeout(()=>openResult(item),150)}spinButton.addEventListener("click",spin);handleButton.addEventListener("click",spin);closeButton.addEventListener("click",closeResult);againButton.addEventListener("click",()=>{closeResult();setTimeout(spin,150)});modal.addEventListener("click",event=>{if(event.target===modal)closeResult()});document.addEventListener("keydown",event=>{if(event.key==="Escape")closeResult()});window.addEventListener("resize",()=>{reels.forEach(reel=>{syncDigitHeights(reel);const digit=Number(reel.querySelector(".reel-strip").dataset.digit||0);positionReel(reel,digit,false)})});buildReels();if(episodes.length!==251)console.warn(`节目数据数量异常：${episodes.length}`)})();</script>
</body>
</html>

<script>(()=>{"use strict";const reels=[...document.querySelectorAll(".reel")],spinButton=document.getElementById("spinButton"),handleButton=document.getElementById("handleButton"),status=document.getElementById("status"),modal=document.getElementById("resultModal"),closeButton=document.getElementById("closeButton"),againButton=document.getElementById("againButton"),listenButton=document.getElementById("listenButton"),errorToast=document.getElementById("errorToast");let spinning=false,lastEpisode=null,audioCtx=null;const allEpisodes=(Array.isArray(window.EPISODES)?window.EPISODES:[]).filter(i=>Number.isInteger(Number(i.episode))&&Number(i.episode)>=1&&Number(i.episode)<=251).sort((a,b)=>Number(a.episode)-Number(b.episode));function showError(m){errorToast.textContent=m;errorToast.classList.add("show");clearTimeout(showError.timer);showError.timer=setTimeout(()=>errorToast.classList.remove("show"),2200)}function positionReel(reel,index,animate=false,duration=1000){const strip=reel.querySelector(".reel-strip"),h=reel.clientHeight;strip.style.transition=animate?`transform ${duration}ms cubic-bezier(.12,.72,.16,1)`:"none";strip.style.transform=`translate3d(0,${-index*h}px,0)`}function buildReels(){reels.forEach(reel=>{const strip=reel.querySelector(".reel-strip"),numbers=[];for(let c=0;c<12;c++)for(let n=0;n<10;n++)numbers.push(n);strip.innerHTML=numbers.map(n=>`<div class="digit">${n}</div>`).join("");strip.dataset.digit="0";requestAnimationFrame(()=>positionReel(reel,0,false))})}function clickSound(freq=280,duration=.045,volume=.018){try{audioCtx||=new(window.AudioContext||window.webkitAudioContext);const osc=audioCtx.createOscillator(),gain=audioCtx.createGain();osc.type="triangle";osc.frequency.value=freq;gain.gain.setValueAtTime(volume,audioCtx.currentTime);gain.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+duration);osc.connect(gain).connect(audioCtx.destination);osc.start();osc.stop(audioCtx.currentTime+duration)}catch(e){}}function winSound(){[392,523,659].forEach((f,i)=>setTimeout(()=>clickSound(f,.13,.035),i*95))}function chooseEpisode(){if(!allEpisodes.length)return null;let item;do item=allEpisodes[Math.floor(Math.random()*allEpisodes.length)];while(allEpisodes.length>1&&Number(item.episode)===lastEpisode);lastEpisode=Number(item.episode);return item}function formatPlays(v){const n=Number(v||0);if(!n)return"";return n>=10000?`${(n/10000).toFixed(n>=100000?0:1)}万播放`:`${n.toLocaleString("zh-CN")}播放`}function openResult(item){const ep=String(item.episode).padStart(3,"0");document.getElementById("resultEpisode").textContent=`第 ${ep} 期`;document.getElementById("resultTitle").textContent=item.title||"未命名节目";document.getElementById("resultHosts").textContent=`主播：${item.hosts||"未标注"}`;document.getElementById("resultDuration").textContent=item.duration?`时长 ${item.duration}`:"";document.getElementById("resultDate").textContent=item.date||"";document.getElementById("resultPlays").textContent=formatPlays(item.plays);listenButton.href=item.url||"#";listenButton.style.display=item.url?"grid":"none";modal.classList.add("open");modal.setAttribute("aria-hidden","false");closeButton.focus({preventScroll:true})}function closeResult(){modal.classList.remove("open");modal.setAttribute("aria-hidden","true")}async function spin(){if(spinning)return;const item=chooseEpisode();if(!item){showError("节目数据加载失败，请刷新后重试");return}spinning=true;spinButton.disabled=true;spinButton.classList.add("pressed");handleButton.classList.remove("pulled");void handleButton.offsetWidth;handleButton.classList.add("pulled");status.classList.add("show");const digits=String(item.episode).padStart(3,"0").split("").map(Number),durations=[920,1210,1510];reels.forEach((reel,i)=>{const current=Number(reel.querySelector(".reel-strip").dataset.digit||0),target=90+digits[i];positionReel(reel,current,false);void reel.offsetWidth;positionReel(reel,target,true,durations[i]);let ticks=0;const timer=setInterval(()=>{clickSound(210+i*45,.025,.012);if(++ticks>12+i*4)clearInterval(timer)},68+i*13)});await new Promise(r=>setTimeout(r,durations[2]+110));reels.forEach((reel,i)=>{const strip=reel.querySelector(".reel-strip");strip.dataset.digit=String(digits[i]);positionReel(reel,digits[i],false)});status.classList.remove("show");spinButton.classList.remove("pressed");spinButton.disabled=false;spinning=false;winSound();setTimeout(()=>openResult(item),150)}spinButton.addEventListener("click",spin);handleButton.addEventListener("click",spin);closeButton.addEventListener("click",closeResult);againButton.addEventListener("click",()=>{closeResult();setTimeout(spin,150)});modal.addEventListener("click",e=>{if(e.target===modal)closeResult()});document.addEventListener("keydown",e=>{if(e.key==="Escape")closeResult()});window.addEventListener("resize",()=>reels.forEach(reel=>positionReel(reel,Number(reel.querySelector(".reel-strip").dataset.digit||0),false)));buildReels();if(allEpisodes.length!==251)console.warn(`节目数据数量异常：${allEpisodes.length}`)})();</script>

  <style>
    :root {

    html {

    body {

    button:focus-visible,

      outline-offset: 3px;
    }

    .app {
      width: min(1120px, calc(100% - 28px));
      margin: 0 auto;
      padding: 24px 0 42px;
    }

    .topbar {
      display: grid;
      grid-template-columns: minmax(0, 410px) 46px;
      align-items: center;

      gap: 10px;

    .sound-toggle {

    .sound-label {

      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
    }

    .tabs {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
      width: 100%;
      margin: 0;
      padding: 6px;
      border: 1px solid rgba(87, 25, 37, 0.1);
      border-radius: 999px;
      background: rgba(255, 250, 242, 0.75);
      box-shadow: 0 8px 24px rgba(79, 52, 42, 0.1);
    }

    .tab {
      min-height: 45px;
      border: 0;
      border-radius: 999px;
      color: var(--muted);
      background: transparent;
      font-weight: 900;
      cursor: pointer;
      transition: color 180ms ease, background 180ms ease, box-shadow 180ms ease;
    }

    .tab[aria-selected="true"] {
      color: #fffaf2;
      background: linear-gradient(180deg, #a74458, var(--wine));
      box-shadow: 0 7px 15px rgba(87, 25, 37, 0.22);

    .page-panel {
      display: none;
    }

    .page-panel.is-active {
      display: block;
      animation: panelIn 280ms ease both;
    }

    @keyframes panelIn {
      from { opacity: 0; transform: translateY(7px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Eating slot machine */
    .eat-machine {
      position: relative;
      overflow: hidden;
      padding: 34px;
      border: 1px solid rgba(255, 255, 255, 0.9);
      border-radius: 30px;
      background:

    .eat-machine::before {
      content: "";

      inset: 12px;
      border: 1px solid rgba(139, 47, 66, 0.1);
      border-radius: 22px;
      pointer-events: none;

    .section-heading {

      letter-spacing: 0;

    .section-heading p {
      margin: 7px 0 0;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .mini-badge {

      padding: 9px 13px;
      border-radius: 999px;

      background: #fff9ef;
      border: 1px solid rgba(139, 47, 66, 0.12);
      font-size: 0.76rem;

    .reel-stage {

      z-index: 1;
      padding: 20px;
      border-radius: 24px;
      border: 1px solid rgba(87, 25, 37, 0.12);
      background: linear-gradient(180deg, #d9c5a9, #bfa688);

    .reels {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
    }

    .reel-column {
      min-width: 0;
    }

    .reel-label {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 34px;
      margin-bottom: 9px;
      border-radius: 999px;
      color: var(--wine-dark);
      background: rgba(255, 250, 242, 0.85);
      font-size: 0.85rem;
      font-weight: 900;
    }

    .reel-window {
      position: relative;
      height: 218px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.9);
      border-radius: 18px;
      background: var(--paper);
      box-shadow: inset 0 0 0 1px rgba(87, 25, 37, 0.06), 0 10px 20px rgba(68, 44, 35, 0.14);
      touch-action: none;

    .reel-window::before,
    .reel-window::after {
      content: "";
      position: absolute;
      z-index: 4;
      left: 0;
      right: 0;
      height: 23%;
      pointer-events: none;
    }

    .reel-window::before {
      top: 0;
      background: linear-gradient(#e7ded1, rgba(255, 250, 242, 0));
    }

    .reel-window::after {
      bottom: 0;
      background: linear-gradient(to top, #e7ded1, rgba(255, 250, 242, 0));
    }

    .reel-track {
      will-change: transform;
    }

    .reel-item {
      height: 218px;
      display: grid;
      place-items: center;
      align-content: center;
      gap: 9px;
      padding: 16px 8px;
    }

    .dish-art {
      position: relative;
      width: 126px;
      height: 126px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background:
        radial-gradient(circle at 37% 30%, #fffef9 0 12%, transparent 13%),

      box-shadow: 0 13px 20px rgba(77, 49, 37, 0.18), inset 0 -8px 14px rgba(107, 75, 57, 0.08);

    .dish-art::before {
      content: "";

      inset: 16px;
      border-radius: 50%;

      box-shadow: inset 0 8px 15px rgba(255, 255, 255, 0.18);

    .dish-icon {
      position: relative;
      z-index: 1;
      font-size: 3.8rem;
      line-height: 1;
      filter: drop-shadow(0 6px 5px rgba(72, 43, 28, 0.18));

    .dish-name {
      max-width: 100%;
      color: #382d2a;
      font-size: 1rem;
      font-weight: 900;
      text-align: center;
      line-height: 1.2;
    }

    .reel-arrow {
      position: absolute;
      z-index: 7;
      left: 50%;
      width: 34px;
      height: 25px;
      transform: translateX(-50%);
      border: 0;
      border-radius: 999px;
      color: #fff;
      background: rgba(87, 25, 37, 0.76);
      cursor: pointer;
      opacity: 0;
      transition: opacity 160ms ease, background 160ms ease;
    }

    .reel-window:hover .reel-arrow,
    .reel-window:focus-within .reel-arrow {
      opacity: 1;
    }

    .reel-arrow:hover {
      background: var(--wine-dark);
    }

    .reel-arrow.up { top: 7px; }
    .reel-arrow.down { bottom: 7px; }

    .eat-controls {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      margin-top: 24px;
    }

    .primary-button {
      min-width: 190px;
      min-height: 58px;
      padding: 0 28px;
      border: 0;
      border-radius: 999px;
      color: #fffaf2;
      background: linear-gradient(180deg, #aa465b, var(--wine) 58%, var(--wine-dark));
      box-shadow: 0 8px 0 #42101a, 0 15px 24px rgba(87, 25, 37, 0.24), inset 0 2px 1px rgba(255, 255, 255, 0.3);

      font-weight: 950;
      cursor: pointer;
      transition: transform 120ms ease, box-shadow 120ms ease;
    }

    .primary-button:hover {
      transform: translateY(-2px);
    }

    .primary-button:active {
      transform: translateY(5px);
      box-shadow: 0 3px 0 #42101a, 0 8px 14px rgba(87, 25, 37, 0.2);
    }

    .primary-button:disabled {
      cursor: wait;
      filter: saturate(0.72);
    }

    .menu-result {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 18px;
      color: var(--muted);
      font-size: 0.82rem;
    }

    .menu-result strong {
      color: var(--wine-dark);
    }

    .result-chip {
      padding: 8px 12px;
      border-radius: 999px;
      color: var(--ink);
      background: #fffaf2;
      border: 1px solid rgba(87, 25, 37, 0.08);
      box-shadow: 0 5px 12px rgba(74, 49, 39, 0.08);
      font-weight: 900;
    }

    /* Compact capsule machine */
    .drink-scene {
      position: relative;
      min-height: 650px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 22px 24px 18px;
      border: 1px solid rgba(255, 255, 255, 0.92);

      background:
        radial-gradient(circle at 8% 8%, rgba(255, 255, 255, 0.96), transparent 24%),

      box-shadow: var(--shadow), inset 0 1px 0 #fff;
      isolation: isolate;
    }

    .drink-scene::before,
    .drink-scene::after {
      content: "";
      position: absolute;
      z-index: -1;
      border: 1px solid rgba(139, 47, 66, 0.09);
      border-radius: 50%;
      pointer-events: none;
    }

    .drink-scene::before {
      width: 240px;
      height: 240px;
      top: -148px;
      left: -88px;
    }

    .drink-scene::after {
      width: 190px;
      height: 190px;
      right: -108px;
      bottom: -104px;
    }

    .drink-heading {
      position: relative;
      z-index: 4;
      flex: none;
      margin-bottom: 14px;
      text-align: center;
    }

    .drink-kicker {
      margin: 0 0 3px;

      font-size: 0.66rem;
      font-weight: 950;
      letter-spacing: 0.2em;
    }

    .neon-title {
      margin: 0;
      color: var(--wine-dark);
      font-family: Georgia, "Noto Serif SC", serif;
      font-size: 1.82rem;
      line-height: 1.08;
    }

    .neon-subtitle {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 0.8rem;
    }

    .lottery-cabinet {
      position: relative;
      z-index: 3;
      width: min(370px, 100%);
      height: 500px;
      flex: 1 1 500px;
      min-height: 430px;
      max-height: 500px;
      display: grid;
      grid-template-rows: minmax(255px, 1fr) 178px;
      margin: 0 auto;
      filter: drop-shadow(0 18px 20px rgba(77, 36, 39, 0.2));
    }

    .cabinet-sign {
      position: absolute;
      top: -8px;
      left: 50%;
      z-index: 7;
      transform: translateX(-50%);
      min-width: 178px;
      padding: 7px 19px 6px;
      border: 2px solid #f4d79c;
      border-radius: 999px;
      color: #fff8e8;
      background: linear-gradient(180deg, #a94359, #7a273b);
      box-shadow: 0 7px 16px rgba(87, 25, 37, 0.2), inset 0 1px 0 rgba(255, 255, 255, 0.36);
      font-size: 0.67rem;
      font-weight: 950;
      letter-spacing: 0.12em;
      text-align: center;
      white-space: nowrap;
    }

    .gacha-globe {
      position: relative;
      z-index: 2;
      min-height: 0;
      padding: 14px 18px 0;
      border-radius: 50% 50% 25px 25px / 42% 42% 15px 15px;
      background: linear-gradient(160deg, #b94e63 0%, #8c3045 70%, #702237 100%);
      box-shadow:
        inset 0 0 0 2px rgba(255, 255, 255, 0.2),
        inset 0 -12px 18px rgba(76, 18, 34, 0.22);
    }

    .gacha-globe::after {
      content: "";
      position: absolute;
      z-index: 4;
      left: 13%;
      right: 13%;
      bottom: -8px;
      height: 27px;
      border: 3px solid #f2c98b;
      border-radius: 50%;
      background: linear-gradient(180deg, #a94359, #78253a);
      box-shadow: 0 6px 10px rgba(77, 28, 37, 0.24);
    }

    .dome {
      position: relative;
      height: 100%;
      overflow: hidden;
      border: 4px solid #f1d9b4;
      border-radius: 50% 50% 30% 30% / 48% 48% 22% 22%;
      background:
        linear-gradient(112deg, rgba(255, 255, 255, 0.46) 0 7%, transparent 8% 72%, rgba(255, 255, 255, 0.18) 73% 79%, transparent 80%),
        radial-gradient(circle at 50% 104%, rgba(143, 85, 115, 0.19), transparent 51%),
        linear-gradient(180deg, rgba(225, 243, 239, 0.93), rgba(226, 214, 219, 0.92));
      box-shadow:
        inset 0 0 30px rgba(87, 25, 37, 0.12),
        inset 0 0 0 5px rgba(255, 255, 255, 0.34);
      backdrop-filter: blur(3px);
    }

    .dome::before {
      content: "";
      position: absolute;
      z-index: 1;
      left: 10%;
      right: 10%;
      bottom: 8px;
      height: 25px;
      border-radius: 50%;
      background: rgba(87, 25, 37, 0.14);
      filter: blur(6px);
    }

    .lottery-ball {
      --delay: 0ms;
      --left: 50%;
      --top: 50%;
      --swing-x: 18px;
      --lift: 38px;
      position: absolute;
      z-index: 2;
      left: var(--left);
      top: var(--top);
      width: 72px;
      height: 72px;
      display: grid;
      place-items: center;
      padding: 14px 7px 7px;
      transform: translate(-50%, -50%);
      overflow: hidden;
      border: 3px solid rgba(255, 255, 255, 0.82);
      border-radius: 50%;
      color: #433233;
      background:
        radial-gradient(circle at 30% 24%, rgba(255, 255, 255, 0.96) 0 7%, transparent 8%),
        linear-gradient(180deg, var(--ball-light) 0 48%, rgba(255, 255, 255, 0.76) 49% 54%, var(--ball-dark) 55% 100%);
      box-shadow:
        inset -7px -8px 12px rgba(69, 32, 36, 0.14),
        0 7px 11px rgba(64, 33, 37, 0.2);
      text-align: center;
      font-size: 0.63rem;
      font-weight: 950;
      line-height: 1.12;
      transition: left 280ms ease, top 280ms ease, opacity 180ms ease;
    }

    .lottery-ball::after {
      content: attr(data-number);
      position: absolute;
      top: 7px;
      right: 8px;
      color: rgba(67, 50, 51, 0.52);
      font-size: 0.52rem;
      font-weight: 900;
    }

    .drink-scene.is-mixing .lottery-ball {
      animation: ballMix 540ms cubic-bezier(0.36, 0, 0.64, 1) infinite alternate;
      animation-delay: var(--delay);
    }

    @keyframes ballMix {
      0% {
        transform: translate(-50%, -50%) translateX(calc(var(--swing-x) * -1)) rotate(-18deg) scale(0.96);
      }
      48% {
        transform: translate(-50%, -50%) translate(var(--swing-x), calc(var(--lift) * -1)) rotate(28deg) scale(1.04);
      }
      100% {
        transform: translate(-50%, -50%) translate(calc(var(--swing-x) * -0.45), 16px) rotate(62deg) scale(0.98);
      }
    }

    .gacha-base {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: 0.9fr 1.1fr;
      align-items: center;
      gap: 16px;
      margin: -2px 16px 0;
      padding: 31px 20px 18px;
      border: 3px solid #74283a;
      border-radius: 22px 22px 34px 34px;
      background:
        radial-gradient(circle at 20% 12%, rgba(255, 255, 255, 0.26), transparent 28%),
        linear-gradient(155deg, #c4586c 0%, #9a384f 56%, #7b273d 100%);
      box-shadow:
        inset 0 0 0 3px rgba(255, 230, 194, 0.14),
        inset 0 -15px 20px rgba(80, 18, 34, 0.2);
    }

    .gacha-base::after {
      content: "";
      position: absolute;
      left: 14%;
      right: 14%;
      bottom: -12px;
      height: 17px;
      border-radius: 0 0 15px 15px;
      background: #642036;
      box-shadow: 0 8px 12px rgba(70, 25, 34, 0.2);
    }

    .draw-button {
      position: relative;
      width: 104px;
      height: 104px;
      justify-self: center;
      display: grid;
      place-items: center;
      align-content: center;
      gap: 2px;
      padding: 0;
      border: 7px solid #f3d5a2;
      border-radius: 50%;
      color: #fffaf1;
      background:
        radial-gradient(circle at 33% 25%, rgba(255, 255, 255, 0.4) 0 7%, transparent 8%),
        linear-gradient(145deg, #a83b55, #6f2037);
      box-shadow:
        0 7px 0 #4d1428,
        0 11px 18px rgba(70, 20, 37, 0.28),
        inset 0 -8px 12px rgba(69, 16, 34, 0.2);
      font-size: 0.81rem;
      font-weight: 950;
      line-height: 1.05;
      cursor: pointer;
      transition: transform 120ms ease, filter 180ms ease, box-shadow 120ms ease;
    }

    .knob-arrow {
      display: block;
      font-family: Arial, sans-serif;
      font-size: 1.6rem;
      line-height: 1;
    }

    .draw-button:hover {
      transform: translateY(-2px) rotate(-2deg);
      filter: brightness(1.05);
    }

    .draw-button:active {
      transform: translateY(5px) rotate(6deg);
      box-shadow: 0 2px 0 #4d1428, 0 6px 11px rgba(70, 20, 37, 0.24);
    }

    .draw-button:disabled {
      cursor: wait;
      filter: saturate(0.72);
    }

    .drink-scene.is-mixing .draw-button {
      animation: knobTurn 620ms ease-in-out infinite;
    }

    @keyframes knobTurn {
      0%, 100% { transform: rotate(0); }
      50% { transform: rotate(22deg); }
    }

    .drawn-ball-wrap {
      position: relative;
      width: 130px;
      height: 92px;
      justify-self: center;
      display: grid;
      place-items: center;
      overflow: hidden;
      border: 4px solid #edc98f;
      border-radius: 14px 14px 26px 26px;
      background: linear-gradient(180deg, #4b1d2b, #251019);
      box-shadow: inset 0 10px 16px rgba(0, 0, 0, 0.35), 0 7px 13px rgba(69, 20, 34, 0.24);
    }

    .chute-label {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      color: rgba(255, 241, 218, 0.58);
      font-size: 0.7rem;
      font-weight: 900;
      letter-spacing: 0.12em;
      transition: opacity 180ms ease;
    }

    .drawn-ball-wrap.has-result .chute-label {
      opacity: 0;
    }

    .drawn-ball {
      width: 72px;
      height: 72px;
      display: grid;
      place-items: center;
      padding: 12px 7px 7px;
      border: 3px solid rgba(255, 255, 255, 0.82);
      border-radius: 50%;
      color: #3e2e2e;
      background:
        radial-gradient(circle at 30% 24%, rgba(255, 255, 255, 0.96) 0 7%, transparent 8%),
        linear-gradient(180deg, #f6df8a 0 48%, rgba(255, 255, 255, 0.78) 49% 54%, #d68b67 55% 100%);
      box-shadow: inset -7px -8px 11px rgba(65, 32, 30, 0.13), 0 7px 13px rgba(0, 0, 0, 0.32);
      font-size: 0.64rem;
      font-weight: 950;
      line-height: 1.1;
      text-align: center;
      opacity: 0;
      visibility: hidden;
    }

    .drawn-ball-wrap.has-result .drawn-ball {
      opacity: 1;
      visibility: visible;
    }

    .drawn-ball.is-dropping {
      animation: ballDrop 660ms cubic-bezier(0.18, 0.76, 0.24, 1.22) both;
    }

    @keyframes ballDrop {
      0% { opacity: 0; transform: translateY(-105px) scale(0.55) rotate(-110deg); }
      68% { opacity: 1; transform: translateY(6px) scale(1.06) rotate(10deg); }
      100% { opacity: 1; transform: translateY(0) scale(1) rotate(0); }
    }

    .drink-result-line {
      position: relative;
      z-index: 4;
      flex: none;
      min-height: 22px;
      margin: 12px 0 0;
      color: var(--muted);
      font-size: 0.78rem;
      text-align: center;
    }

    .drink-result-line strong {
      color: var(--wine-dark);
    }

    /* 3D vintage capsule machine */
    .lottery-cabinet {
      width: min(340px, 100%);
      height: 500px;
      flex: 0 1 500px;
      min-height: 450px;
      max-height: 500px;
      display: flex;
      flex-direction: column;
      align-items: center;
      filter:
        drop-shadow(0 20px 15px rgba(71, 27, 35, 0.2))
        drop-shadow(0 5px 4px rgba(71, 27, 35, 0.14));
      perspective: 900px;
    }

    .cabinet-sign {
      display: none;
    }

    .machine-top {
      position: absolute;
      z-index: 8;
      top: 0;
      left: 50%;
      width: 206px;
      height: 39px;
      transform: translateX(-50%);
      border: 2px solid #8a694d;
      border-radius: 50%;
      background:
        linear-gradient(90deg, #6f4a34 0%, #f2d5a1 18%, #9d7553 48%, #f6dfad 76%, #765039 100%);
      box-shadow:
        inset 0 5px 7px rgba(255, 255, 255, 0.55),
        inset 0 -7px 8px rgba(76, 42, 29, 0.26),
        0 7px 8px rgba(84, 49, 40, 0.2);
    }

    .machine-top::before {
      content: "";
      position: absolute;
      left: 50%;
      top: -16px;
      width: 45px;
      height: 27px;
      transform: translateX(-50%);
      border: 2px solid #8a694d;
      border-radius: 50% 50% 38% 38%;
      background:
        radial-gradient(circle at 36% 24%, rgba(255, 255, 255, 0.62) 0 9%, transparent 10%),
        linear-gradient(145deg, #f5dda9, #9c704c 68%, #704731);
      box-shadow: 0 5px 7px rgba(74, 42, 31, 0.24);
    }

    .machine-top::after {
      content: "";
      position: absolute;
      inset: 5px 18px 9px;
      border-radius: 50%;
      border-top: 2px solid rgba(255, 255, 255, 0.62);
    }

    .gacha-globe {
      position: relative;
      z-index: 4;
      width: 300px;
      height: 300px;
      min-height: 300px;
      flex: none;
      margin-top: 15px;
      padding: 18px;
      border-radius: 50%;
      background: transparent;
      box-shadow: none;
    }

    .gacha-globe::after {
      content: "";
      position: absolute;
      z-index: 7;
      left: 9px;
      right: 9px;
      bottom: -3px;
      height: 35px;
      border: 2px solid #876347;
      border-radius: 50%;
      background:
        linear-gradient(90deg, #6c4632 0%, #f3d9a9 16%, #9b7353 49%, #f7e3ba 78%, #6c4936 100%);
      box-shadow:
        inset 0 6px 7px rgba(255, 255, 255, 0.48),
        inset 0 -8px 8px rgba(70, 38, 29, 0.24),
        0 7px 8px rgba(84, 49, 40, 0.22);
    }

    .dome {
      width: 100%;
      height: 100%;
      border: 5px solid rgba(128, 94, 72, 0.7);
      border-radius: 50%;
      background:
        radial-gradient(circle at 30% 23%, rgba(255, 255, 255, 0.78) 0 4%, transparent 5%),
        radial-gradient(circle at 68% 68%, rgba(116, 74, 100, 0.18), transparent 45%),
        linear-gradient(112deg, rgba(255, 255, 255, 0.48) 0 8%, transparent 9% 70%, rgba(255, 255, 255, 0.22) 71% 77%, transparent 78%),
        linear-gradient(180deg, rgba(243, 249, 244, 0.92), rgba(222, 208, 214, 0.88));
      box-shadow:
        inset 14px 8px 24px rgba(255, 255, 255, 0.58),
        inset -16px -14px 28px rgba(95, 53, 71, 0.18),
        inset 0 0 0 4px rgba(255, 255, 255, 0.46),
        0 7px 12px rgba(80, 46, 48, 0.18);
      backdrop-filter: blur(2px);
    }

    .dome::before {
      left: 12%;
      right: 12%;
      bottom: 17px;
      height: 30px;
      background: rgba(80, 42, 57, 0.17);
      filter: blur(7px);
    }

    .dome::after {
      content: "";
      position: absolute;
      z-index: 5;
      top: 13%;
      left: 15%;
      width: 20%;
      height: 47%;
      transform: rotate(19deg);
      border-radius: 50%;
      background: linear-gradient(90deg, rgba(255, 255, 255, 0.46), rgba(255, 255, 255, 0.04));
      filter: blur(1px);
      pointer-events: none;
    }

    .lottery-ball {
      border-color: rgba(255, 255, 255, 0.9);
      box-shadow:
        inset 8px 7px 11px rgba(255, 255, 255, 0.38),
        inset -9px -10px 13px rgba(69, 32, 36, 0.19),
        0 8px 12px rgba(64, 33, 37, 0.24);
    }

    .gacha-base {
      position: relative;
      z-index: 2;
      width: 258px;
      min-height: 196px;
      flex: 1 0 196px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      gap: 7px;
      margin: -5px 0 0;
      padding: 36px 25px 14px;
      border: 3px solid #6d2739;
      border-radius: 24px 24px 45px 45px;
      background:
        radial-gradient(circle at 24% 13%, rgba(255, 255, 255, 0.34), transparent 24%),
        linear-gradient(90deg, rgba(86, 22, 42, 0.32), transparent 15% 82%, rgba(77, 17, 36, 0.34)),
        linear-gradient(150deg, #d8677b 0%, #b3465e 34%, #8d2f48 70%, #6d2139 100%);
      box-shadow:
        inset 5px 0 7px rgba(255, 255, 255, 0.18),
        inset -9px -7px 15px rgba(62, 10, 30, 0.28),
        inset 0 -19px 24px rgba(68, 14, 31, 0.2),
        0 12px 17px rgba(67, 26, 35, 0.22);
      transform: perspective(640px) rotateX(1deg);
    }

    .gacha-base::before {
      content: "";
      position: absolute;
      z-index: 5;
      top: -18px;
      left: -7px;
      right: -7px;
      height: 39px;
      border: 2px solid #876347;
      border-radius: 50%;
      background:
        linear-gradient(90deg, #684532 0%, #f3dab0 16%, #a67b58 49%, #f6e4bc 78%, #6c4936 100%);
      box-shadow:
        inset 0 7px 7px rgba(255, 255, 255, 0.48),
        inset 0 -8px 8px rgba(70, 38, 29, 0.25),
        0 7px 8px rgba(76, 42, 36, 0.22);
    }

    .gacha-base::after {
      left: 12%;
      right: 12%;
      bottom: -12px;
      height: 22px;
      border: 2px solid #581729;
      border-radius: 0 0 19px 19px;
      background: linear-gradient(180deg, #76233d, #451124);
      box-shadow: 0 9px 11px rgba(64, 20, 31, 0.24);
    }

    .machine-brand {
      position: absolute;
      z-index: 6;
      top: 21px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255, 244, 222, 0.88);
      font-family: Georgia, serif;
      font-size: 0.52rem;
      font-weight: 900;
      letter-spacing: 0.18em;
      white-space: nowrap;
      text-shadow: 0 1px 1px rgba(70, 18, 34, 0.35);
    }

    .draw-button {
      position: relative;
      z-index: 6;
      width: 89px;
      height: 78px;
      flex: none;
      display: grid;
      place-items: center;
      align-content: center;
      padding: 0 9px;
      border: 7px solid #d5b079;
      border-radius: 44%;
      color: #fffaf1;
      background:
        radial-gradient(circle at 31% 23%, rgba(255, 255, 255, 0.52) 0 7%, transparent 8%),
        linear-gradient(145deg, #b94d64, #7d273f 68%, #59172c);
      box-shadow:
        0 8px 0 #431024,
        0 12px 16px rgba(62, 15, 32, 0.3),
        inset 5px 5px 9px rgba(255, 255, 255, 0.16),
        inset -7px -9px 11px rgba(55, 7, 25, 0.24);
      font-size: 0.77rem;
      font-weight: 950;
      line-height: 1.08;
    }

    .draw-button::after {
      content: "";
      position: absolute;
      inset: -12px;
      z-index: -1;
      border: 3px solid #8f6749;
      border-radius: 28%;
      background:
        linear-gradient(135deg, #f4dfb5, #967052 50%, #e8c990 74%, #745039);
      box-shadow:
        inset 0 0 0 2px rgba(255, 255, 255, 0.28),
        0 5px 8px rgba(70, 28, 34, 0.22);
    }

    .knob-arrow {
      display: none;
    }

    .draw-button:hover {
      transform: translateY(-2px);
    }

    .draw-button:active {
      transform: translateY(5px);
    }

    .drink-scene.is-mixing .draw-button {
      animation: buttonPulse 460ms ease-in-out infinite alternate;
    }

    @keyframes buttonPulse {
      from { transform: translateY(0) scale(1); }
      to { transform: translateY(3px) scale(0.97); }
    }

    .drawn-ball-wrap {
      position: relative;
      z-index: 6;
      width: 114px;
      height: 57px;
      flex: none;
      overflow: hidden;
      border: 5px solid #d4ad75;
      border-radius: 12px 12px 25px 25px;
      background:
        linear-gradient(110deg, rgba(255, 255, 255, 0.09), transparent 28%),
        linear-gradient(180deg, #431323, #1f0911);
      box-shadow:
        inset 0 11px 14px rgba(0, 0, 0, 0.42),
        0 6px 8px rgba(61, 15, 29, 0.26);
    }

    .chute-label {
      font-size: 0.62rem;
    }

    .drawn-ball {
      width: 49px;
      height: 49px;
      padding: 9px 4px 4px;
      border-width: 2px;
      font-size: 0.45rem;
    }

    .drink-scene.is-winning .machine-top,
    .drink-scene.is-winning .gacha-globe::after,
    .drink-scene.is-winning .gacha-base::before {
      animation: metalGleam 820ms ease-out 1;
    }

    @keyframes metalGleam {
      0%, 100% { filter: brightness(1); }
      45% { filter: brightness(1.42); }
    }

    /* Winner modal */
    .win-modal {
      position: fixed;
      z-index: 50;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 20px;
      background: rgba(17, 12, 17, 0.72);
      backdrop-filter: blur(7px);
      opacity: 0;
      visibility: hidden;
      transition: opacity 220ms ease, visibility 220ms ease;
    }

    .win-modal.is-open {
      opacity: 1;
      visibility: visible;
    }

    .win-dialog {
      position: relative;
      width: min(430px, 100%);
      overflow: hidden;
      padding: 32px 26px 26px;
      border: 3px solid #e5bd73;
      border-radius: 24px;
      color: #38262b;
      background:
        radial-gradient(circle at 50% -20%, rgba(255, 255, 255, 0.95), transparent 48%),
        linear-gradient(160deg, #fff8e9, #ead8bf);
      box-shadow:
        0 0 0 8px rgba(111, 53, 65, 0.5),
        0 0 35px rgba(255, 198, 107, 0.35),
        0 28px 70px rgba(0, 0, 0, 0.48);
      text-align: center;
      transform: translateY(18px) scale(0.92);
      transition: transform 320ms cubic-bezier(0.2, 0.88, 0.3, 1.15);
    }

    .win-modal.is-open .win-dialog {
      transform: translateY(0) scale(1);
    }

    .win-dialog::before {
      content: "";
      position: absolute;
      inset: 9px;
      border: 1px solid rgba(139, 47, 66, 0.14);
      border-radius: 16px;
      pointer-events: none;
    }

    .modal-close {
      position: absolute;
      z-index: 2;
      top: 12px;
      right: 12px;
      width: 36px;
      height: 36px;

    .win-kicker {

    .win-glass {

    .win-glass-icon {

    .win-dialog h3 {

    .modal-actions {

    class FoodReel {

        this.busy = false;

      build() {
        const column = document.createElement("section");
        column.className = "reel-column";
        column.innerHTML = `
          <div class="reel-window" tabindex="0" role="listbox" aria-label="${this.group.label}，可上下滑动选择">

            <div class="reel-track"></div>

        document.getElementById("foodReels").appendChild(column);
        this.column = column;
        this.window = column.querySelector(".reel-window");
        this.track = column.querySelector(".reel-track");

        const repeated = [];
        for (let copy = 0; copy < 11; copy += 1) {
          this.group.items.forEach(item => {
            repeated.push(`
              <div class="reel-item" role="option">
                <div class="reel-label">${this.group.label}</div>
                <div class="dish-art" style="--dish-bg:${item.color}">

                </div>
                <div class="dish-name">${item.name}</div>
              </div>
            `);
          });
        }
        this.track.innerHTML = repeated.join("");
      }

      bind() {
        this.window.querySelector(".up").addEventListener("click", event => {
          event.stopPropagation();
          this.step(-1);
        });
        this.window.querySelector(".down").addEventListener("click", event => {
          event.stopPropagation();
          this.step(1);
        });
        this.window.addEventListener("wheel", event => {
          if (this.busy) return;
          event.preventDefault();
          this.step(event.deltaY > 0 ? 1 : -1);
        }, { passive: false });
        this.window.addEventListener("keydown", event => {
          if (event.key === "ArrowUp" || event.key === "ArrowDown") {
            event.preventDefault();
            this.step(event.key === "ArrowDown" ? 1 : -1);
          }
        });
        this.window.addEventListener("pointerdown", event => {
          if (this.busy) return;
          this.dragging = true;
          this.pointerId = event.pointerId;
          this.startY = event.clientY;
          this.window.setPointerCapture?.(event.pointerId);
        });
        this.window.addEventListener("pointerup", event => {
          if (!this.dragging || event.pointerId !== this.pointerId) return;
          this.dragging = false;
          const distance = event.clientY - this.startY;
          if (Math.abs(distance) > 24) this.step(distance < 0 ? 1 : -1);
        });
        this.window.addEventListener("pointercancel", () => {
          this.dragging = false;
        });
        window.addEventListener("resize", () => {
          this.measure();
          this.render(0);
        });
      }

      selectedIndex() {
        const length = this.group.items.length;
        return ((this.virtualIndex % length) + length) % length;
      }

      measure() {
        const measured = this.window.getBoundingClientRect().height;
        if (measured > 20) this.itemHeight = measured;
        this.track.style.setProperty("--reel-item-height", `${this.itemHeight}px`);
      }

      render(duration = 220) {
        this.track.style.transition = duration ? `transform ${duration}ms cubic-bezier(.2,.75,.2,1)` : "none";
        this.track.style.transform = `translate3d(0, ${-this.virtualIndex * this.itemHeight}px, 0)`;
      }

      updateResult() {
        const item = this.group.items[this.selectedIndex()];
        document.getElementById(this.group.resultId).textContent = item.name;
      }

      normalize() {
        this.virtualIndex = this.group.items.length * 5 + this.selectedIndex();
        this.render(0);
      }

      step(direction) {
        if (this.busy) return;
        this.virtualIndex += direction;
        this.render();
        this.updateResult();
        window.setTimeout(() => this.normalize(), 250);

      async spinTo(target, loops) {
        this.busy = true;
        this.column.classList.add("is-rolling");
        const distance = ((target - this.selectedIndex()) + this.group.items.length) % this.group.items.length;
        const steps = loops * this.group.items.length + distance;

          const duration = reduceMotion ? 1 : progress < 0.65 ? 62 : 62 + Math.pow((progress - 0.65) / 0.35, 2) * 230;
          this.render(duration);
          this.updateResult();
          if (soundEnabled && step % 2 === 0) playTick(520 + step * 4, 0.022);
          await wait(duration + 6);
        }

        this.busy = false;
        this.column.classList.remove("is-rolling");
        this.normalize();
      }
    }

    const foodReels = foodData.map(group => new FoodReel(group));
    const eatScene = document.getElementById("eatScene");
    const leverControl = document.getElementById("leverControl");
    const foodMachineResult = document.getElementById("foodMachineResult");
    let foodSpinning = false;
    let leverPointerId = null;
    let leverStartY = 0;
    let leverDistance = 0;

    function currentFoodNames() {
      return foodReels.map(reel => reel.group.items[reel.selectedIndex()].name);
    }

    async function spinFood() {
      if (foodSpinning || foodReels.some(reel => reel.busy)) return;
      foodSpinning = true;
      initAudio();
      foodMachineResult.textContent = "转轮滚动中…";
      eatScene.classList.add("is-spinning");
      playStartSound();

      const targets = foodReels.map(reel => Math.floor(Math.random() * reel.group.items.length));
      await Promise.all([
        foodReels[0].spinTo(targets[0], 5),
        foodReels[1].spinTo(targets[1], 6),
        foodReels[2].spinTo(targets[2], 7)
      ]);

      playSoftWin();
      eatScene.classList.remove("is-spinning");
      foodMachineResult.textContent = currentFoodNames().join(" · ");
      foodSpinning = false;
    }

    function resetLever() {
      leverControl.classList.remove("is-pulling");
      leverControl.classList.add("is-releasing");
      leverControl.style.setProperty("--lever-shift", "0px");
      leverControl.style.setProperty("--lever-angle", "0deg");
      window.setTimeout(() => leverControl.classList.remove("is-releasing"), 320);
      leverPointerId = null;
      leverDistance = 0;
    }

    leverControl.addEventListener("pointerdown", event => {
      if (foodSpinning) return;
      leverPointerId = event.pointerId;
      leverStartY = event.clientY;
      leverDistance = 0;
      leverControl.classList.add("is-pulling");
      leverControl.setPointerCapture?.(event.pointerId);
      initAudio();
      playTick(260, 0.018);
    });

    leverControl.addEventListener("pointermove", event => {
      if (event.pointerId !== leverPointerId) return;
      const maxPull = Math.max(54, leverControl.clientHeight * 0.55);
      leverDistance = Math.min(maxPull, Math.max(0, event.clientY - leverStartY));
      const pullProgress = Math.min(1, leverDistance / maxPull);
      leverControl.style.setProperty("--lever-shift", `${leverDistance}px`);
      leverControl.style.setProperty("--lever-angle", `${-36 * pullProgress}deg`);
      if (leverDistance > maxPull * 0.72 && !leverControl.classList.contains("is-ready")) {
        leverControl.classList.add("is-ready");
        playTick(340, 0.024);
      }
    });

    leverControl.addEventListener("pointerup", event => {
      if (event.pointerId !== leverPointerId) return;
      const threshold = Math.max(46, leverControl.clientHeight * 0.34);
      const shouldSpin = leverDistance >= threshold;
      leverControl.classList.remove("is-ready");
      resetLever();
      if (shouldSpin) spinFood();
    });

    leverControl.addEventListener("pointercancel", () => {
      leverControl.classList.remove("is-ready");
      resetLever();
    });

    leverControl.addEventListener("keydown", event => {
      if (event.key !== "Enter" && event.key !== " ") return;
      event.preventDefault();
      leverControl.classList.add("is-pulling");
      leverControl.style.setProperty("--lever-shift", `${Math.max(52, leverControl.clientHeight * 0.48)}px`);
      leverControl.style.setProperty("--lever-angle", "-36deg");
      window.setTimeout(() => {
        resetLever();
        spinFood();
      }, reduceMotion ? 1 : 260);
    });

    /* Native horizontal swipe pager with a WeChat touch fallback */
    if ("scrollRestoration" in history) {
      history.scrollRestoration = "manual";
    }

    const pageViewport = document.getElementById("pageViewport");
    const panels = [...document.querySelectorAll(".page-panel")];
    let pageIndex = 0;
    let pageScrollFrame = 0;
    let pageTouchActive = false;
    let pageTouchHorizontal = false;
    let pageTouchStartX = 0;
    let pageTouchStartY = 0;
    let pageTouchDeltaX = 0;
    let pageTouchBaseIndex = 0;
    let entryLockActive = true;
    let pageProgrammaticTarget = null;

    function updatePageState(nextIndex) {
      pageIndex = Math.max(0, Math.min(panels.length - 1, nextIndex));
      panels.forEach((panel, index) => {
        const active = index === pageIndex;
        panel.classList.toggle("is-active", active);
        panel.setAttribute("aria-hidden", String(!active));
      });
      document.body.classList.toggle("drink-mode", pageIndex === 1);
      if (pageIndex === 0) {
        requestAnimationFrame(() => {
          foodReels.forEach(reel => {
            reel.measure();
            reel.render(0);
          });
        });
      }
    }

    function showPage(nextIndex, animate = true) {
      const targetIndex = Math.max(0, Math.min(panels.length - 1, nextIndex));
      pageProgrammaticTarget = targetIndex;
      updatePageState(targetIndex);
      pageViewport.classList.add("is-settling");
      pageViewport.scrollLeft = targetIndex * pageViewport.clientWidth;
      requestAnimationFrame(() => {
        updatePageState(targetIndex);
        pageProgrammaticTarget = null;
        pageViewport.classList.remove("is-settling");
      });
    }

    pageViewport.addEventListener("scroll", () => {
      if (pageScrollFrame) return;
      pageScrollFrame = requestAnimationFrame(() => {
        pageScrollFrame = 0;
        if (pageTouchActive) return;
        const width = Math.max(1, pageViewport.clientWidth);
        if (pageProgrammaticTarget !== null) {
          const targetLeft = pageProgrammaticTarget * width;
          if (Math.abs(pageViewport.scrollLeft - targetLeft) <= 2) {
            updatePageState(pageProgrammaticTarget);
            pageProgrammaticTarget = null;
          }
          return;
        }
        updatePageState(Math.round(pageViewport.scrollLeft / width));
      });
    }, { passive: true });

    pageViewport.addEventListener("touchstart", event => {
      if (event.touches.length !== 1 || event.target.closest(".win-modal")) return;
      entryLockActive = false;
      pageProgrammaticTarget = null;
      const touch = event.touches[0];
      pageTouchActive = true;
      pageTouchHorizontal = false;
      pageTouchStartX = touch.clientX;
      pageTouchStartY = touch.clientY;
      pageTouchDeltaX = 0;
      pageTouchBaseIndex = pageIndex;
    }, { passive: true });

    pageViewport.addEventListener("touchmove", event => {
      if (!pageTouchActive || event.touches.length !== 1) return;
      const touch = event.touches[0];
      const dx = touch.clientX - pageTouchStartX;
      const dy = touch.clientY - pageTouchStartY;
      if (!pageTouchHorizontal && Math.abs(dx) > 10 && Math.abs(dx) > Math.abs(dy) * 1.08) {
        pageTouchHorizontal = true;
        pageViewport.classList.add("is-touching");
      }
      if (!pageTouchHorizontal) return;
      event.preventDefault();
      pageTouchDeltaX = dx;
      const width = Math.max(1, pageViewport.clientWidth);
      const maxScroll = width * (panels.length - 1);
      const targetScroll = pageTouchBaseIndex * width - dx;
      pageViewport.scrollLeft = Math.max(0, Math.min(maxScroll, targetScroll));
    }, { passive: false });

    function finishTouchPageSwipe(cancelled = false) {
      if (!pageTouchActive) return;
      const threshold = Math.min(72, Math.max(42, pageViewport.clientWidth * 0.13));
      let nextIndex = pageTouchBaseIndex;
      if (!cancelled && pageTouchHorizontal && Math.abs(pageTouchDeltaX) >= threshold) {
        nextIndex += pageTouchDeltaX < 0 ? 1 : -1;
      }
      pageTouchActive = false;
      pageTouchHorizontal = false;
      pageTouchDeltaX = 0;
      pageViewport.classList.remove("is-touching");
      showPage(nextIndex);
    }

    pageViewport.addEventListener("touchend", () => finishTouchPageSwipe(false), { passive: true });
    pageViewport.addEventListener("touchcancel", () => finishTouchPageSwipe(true), { passive: true });

    window.addEventListener("resize", () => {
      pageViewport.scrollTo({ left: pageIndex * pageViewport.clientWidth, behavior: "auto" });
    });

    document.addEventListener("keydown", event => {
      if (event.key === "ArrowLeft") {
        entryLockActive = false;
        showPage(pageIndex - 1);
      }
      if (event.key === "ArrowRight") {
        entryLockActive = false;
        showPage(pageIndex + 1);
      }
    });

    function resetEntryPage() {
      if (!entryLockActive) return;
      pageViewport.classList.remove("is-touching");
      pageProgrammaticTarget = 0;
      pageViewport.scrollLeft = 0;
      pageViewport.scrollTo({ left: 0, behavior: "auto" });
      updatePageState(0);
    }

    resetEntryPage();
    requestAnimationFrame(resetEntryPage);
    [120, 420, 900, 1600, 2600].forEach(delay => window.setTimeout(resetEntryPage, delay));
    window.addEventListener("load", resetEntryPage, { once: true });
    window.addEventListener("pageshow", () => {
      entryLockActive = true;
      resetEntryPage();
      [120, 420, 900, 1600].forEach(delay => window.setTimeout(resetEntryPage, delay));
    });
    document.addEventListener("visibilitychange", () => {
      if (!document.hidden) resetEntryPage();
    });

    const drinkScene = document.getElementById("drinkScene");
    const drawButton = document.getElementById("drawButton");
    const drawnBall = document.getElementById("drawnBall");
    const drawnBallWrap = document.getElementById("drawnBallWrap");
    const drinkResult = document.getElementById("drinkResult");
    const winModal = document.getElementById("winModal");
    const winTitle = document.getElementById("winTitle");
    const winNote = document.getElementById("winNote");
    const winGlassIcon = document.getElementById("winGlassIcon");
    const modalClose = document.getElementById("modalClose");
    const acceptDrink = document.getElementById("acceptDrink");
    const drawAgain = document.getElementById("drawAgain");
    const capsuleMotionLayer = document.querySelector(".capsule-motion-layer");
    const motionCapsules = [...document.querySelectorAll(".motion-capsule")];
    const capsuleStarts = [
      [0.04, 0.05], [0.29, 0.03], [0.54, 0.06], [0.76, 0.04],
      [0.01, 0.38], [0.26, 0.36], [0.51, 0.39], [0.76, 0.37],
      [0.13, 0.70], [0.39, 0.69], [0.65, 0.70]
    ];
    const capsuleBodies = motionCapsules.map((element, index) => ({
      element,
      x: 0,
      y: 0,
      vx: 0,
      vy: 0,
      rotation: index * 23
    }));
    let capsuleAnimationFrame = 0;
    let capsuleLastTime = 0;
    let capsuleMixing = false;
    let capsuleSettleUntil = 0;
    let drawing = false;

    function renderCapsules() {
      capsuleBodies.forEach(body => {
        body.element.style.left = `${body.x}px`;
        body.element.style.top = `${body.y}px`;
        body.element.style.transform = `translate3d(0, 0, 0) rotate(${body.rotation}deg)`;
      });
    }

    function layoutCapsules(reset = false) {
      const width = capsuleMotionLayer.clientWidth;
      const height = capsuleMotionLayer.clientHeight;
      if (!width || !height) return;
      capsuleBodies.forEach((body, index) => {
        if (reset || (!body.x && !body.y)) {
          body.x = capsuleStarts[index][0] * width;
          body.y = capsuleStarts[index][1] * height;
          body.vx = 0;
          body.vy = 0;
        } else {
          const size = body.element.offsetWidth;
          body.x = Math.min(Math.max(0, body.x), Math.max(0, width - size));
          body.y = Math.min(Math.max(0, body.y), Math.max(0, height - size));
        }
      });
      renderCapsules();
    }

    function resolveCapsuleCollisions() {
      for (let i = 0; i < capsuleBodies.length; i += 1) {
        for (let j = i + 1; j < capsuleBodies.length; j += 1) {
          const first = capsuleBodies[i];
          const second = capsuleBodies[j];
          const radius = first.element.offsetWidth * 0.42;
          const firstX = first.x + radius;
          const firstY = first.y + radius;
          const secondX = second.x + radius;
          const secondY = second.y + radius;
          const dx = secondX - firstX;
          const dy = secondY - firstY;
          const distance = Math.hypot(dx, dy) || 0.01;
          const minimum = radius * 2;
          if (distance >= minimum) continue;
          const nx = dx / distance;
          const ny = dy / distance;
          const overlap = (minimum - distance) * 0.52;
          first.x -= nx * overlap;
          first.y -= ny * overlap;
          second.x += nx * overlap;
          second.y += ny * overlap;
          const relative = (second.vx - first.vx) * nx + (second.vy - first.vy) * ny;
          if (relative < 0) {
            const impulse = relative * 0.92;
            first.vx += impulse * nx;
            first.vy += impulse * ny;
            second.vx -= impulse * nx;
            second.vy -= impulse * ny;
          }
        }
      }
    }

    function animateCapsules(now) {
      const width = capsuleMotionLayer.clientWidth;
      const height = capsuleMotionLayer.clientHeight;
      if (!width || !height) {
        capsuleAnimationFrame = requestAnimationFrame(animateCapsules);
        return;
      }
      const timeStep = Math.min(1.75, Math.max(0.55, (now - capsuleLastTime) / 16.67));
      capsuleLastTime = now;

      capsuleBodies.forEach(body => {
        const size = body.element.offsetWidth;
        if (capsuleMixing) {
          body.vy += 0.1 * timeStep;
          if (Math.random() < 0.035 * timeStep) {
            body.vx += (Math.random() - 0.5) * 4.2;
            body.vy += (Math.random() - 0.58) * 4.6;
          }
        } else {
          body.vy += 0.15 * timeStep;
          body.vx *= Math.pow(0.965, timeStep);
          body.vy *= Math.pow(0.982, timeStep);
        }

        body.x += body.vx * timeStep;
        body.y += body.vy * timeStep;
        body.rotation += body.vx * 1.9 * timeStep;

        const maxX = Math.max(0, width - size);
        const maxY = Math.max(0, height - size);
        if (body.x <= 0 || body.x >= maxX) {
          body.x = Math.min(maxX, Math.max(0, body.x));
          body.vx *= -0.88;
        }
        if (body.y <= 0 || body.y >= maxY) {
          body.y = Math.min(maxY, Math.max(0, body.y));
          body.vy *= -0.84;
          body.vx += (Math.random() - 0.5) * 0.9;
        }
      });

      resolveCapsuleCollisions();
      renderCapsules();

      if (capsuleMixing || now < capsuleSettleUntil) {
        capsuleAnimationFrame = requestAnimationFrame(animateCapsules);
      } else {
        capsuleAnimationFrame = 0;
      }
    }

    function startCapsuleMixing() {
      motionCapsules.forEach(capsule => capsule.classList.remove("is-exiting"));
      layoutCapsules(false);
      capsuleBodies.forEach((body, index) => {
        const direction = index % 2 === 0 ? 1 : -1;
        body.vx = direction * (2.2 + Math.random() * 2.8);
        body.vy = -3.2 - Math.random() * 3.5;
      });
      capsuleMixing = true;
      capsuleSettleUntil = 0;
      capsuleLastTime = performance.now();
      if (!capsuleAnimationFrame && !reduceMotion) {
        capsuleAnimationFrame = requestAnimationFrame(animateCapsules);
      }
    }

    function stopCapsuleMixing() {
      capsuleMixing = false;
      capsuleSettleUntil = performance.now() + (reduceMotion ? 0 : 720);
      if (!capsuleAnimationFrame && !reduceMotion) {
        capsuleLastTime = performance.now();
        capsuleAnimationFrame = requestAnimationFrame(animateCapsules);
      }
    }

    function releaseCapsule() {
      const candidates = capsuleBodies
        .slice()
        .sort((first, second) => second.y - first.y);
      const selected = candidates[Math.floor(Math.random() * Math.min(4, candidates.length))];
      selected.element.classList.add("is-exiting");
    }

    requestAnimationFrame(() => layoutCapsules(true));
    window.addEventListener("resize", () => layoutCapsules(false));

    function setDrawButtonLabel(label) {
      drawButton.innerHTML = `
        <span>${label}</span>
      `;
    }

    async function drawDrink() {
      if (drawing) return;
      drawing = true;
      initAudio();
      closeModal();
      clearConfetti();
      drinkScene.classList.remove("is-winning");
      drinkScene.classList.add("is-mixing");
      startCapsuleMixing();
      drawButton.disabled = true;
      setDrawButtonLabel("喝一杯");
      drinkResult.textContent = "扭蛋正在滚动，今晚的答案马上掉下来。";
      drawnBallWrap.classList.remove("has-result");
      drawnBall.classList.remove("is-dropping");
      drawnBall.textContent = "";
      playStartSound();

      const rounds = reduceMotion ? 4 : 18;
      for (let i = 0; i < rounds; i += 1) {
        playTick(450 + i * 19, 0.028);
        await wait(reduceMotion ? 15 : 90 + i * 7);
      }

      const winner = drinks[Math.floor(Math.random() * drinks.length)];
      drinkScene.classList.remove("is-mixing");
      stopCapsuleMixing();
      releaseCapsule();
      drawnBall.textContent = winner.name;
      void drawnBall.offsetWidth;
      drawnBallWrap.classList.add("has-result");
      drawnBall.classList.add("is-dropping");
      await wait(reduceMotion ? 20 : 680);

      drinkScene.classList.add("is-winning");
      drinkResult.innerHTML = `今晚抽中：<strong>${winner.name}</strong>`;
      setDrawButtonLabel("喝一杯");
      drawButton.disabled = false;
      playWinSound();
      createConfetti();
      await wait(reduceMotion ? 30 : 520);
      openModal(winner);
      drawing = false;

      window.setTimeout(() => {
        drinkScene.classList.remove("is-winning");
      }, 4200);
    }

    drawButton.addEventListener("click", drawDrink);

    function openModal(winner) {
      winTitle.textContent = winner.name;
      winNote.textContent = winner.note;
      winGlassIcon.src = winner.icon;
      winModal.classList.add("is-open");
      winModal.setAttribute("aria-hidden", "false");
      modalClose.focus();
    }

    function closeModal() {
      winModal.classList.remove("is-open");
      winModal.setAttribute("aria-hidden", "true");
    }

    modalClose.addEventListener("click", closeModal);
    acceptDrink.addEventListener("click", closeModal);
    drawAgain.addEventListener("click", () => {
      closeModal();
      drawDrink();
    });
    winModal.addEventListener("click", event => {
      if (event.target === winModal) closeModal();
    });
    document.addEventListener("keydown", event => {
      if (event.key === "Escape" && winModal.classList.contains("is-open")) closeModal();
    });

    function createConfetti() {
      if (reduceMotion) return;
      const colors = ["#ff718f", "#75e6dd", "#ffd56c", "#fff4dc", "#b696d8"];
      for (let i = 0; i < 46; i += 1) {
        const piece = document.createElement("i");
        piece.className = "confetti";
        piece.style.left = `${Math.random() * 100}vw`;
        piece.style.background = colors[i % colors.length];
        piece.style.setProperty("--drift", `${Math.round(Math.random() * 180 - 90)}px`);
        piece.style.setProperty("--fall-time", `${1.8 + Math.random() * 1.8}s`);
        piece.style.animationDelay = `${Math.random() * 0.5}s`;
        document.body.appendChild(piece);
        window.setTimeout(() => piece.remove(), 4300);
      }
    }

    function clearConfetti() {
      document.querySelectorAll(".confetti").forEach(piece => piece.remove());
    }

    /* Browser-generated sound effects */
    const soundToggle = document.getElementById("soundToggle");
    let soundEnabled = true;
    let audioContext = null;

    function initAudio() {
      if (!soundEnabled) return;
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (!AudioCtx) return;
      if (!audioContext) audioContext = new AudioCtx();
      if (audioContext.state === "suspended") audioContext.resume();
    }

    function tone(frequency, duration, delay = 0, volume = 0.04, type = "sine") {
      if (!soundEnabled) return;
      initAudio();
      if (!audioContext) return;

      const oscillator = audioContext.createOscillator();
      const gain = audioContext.createGain();
      const start = audioContext.currentTime + delay;
      oscillator.type = type;
      oscillator.frequency.setValueAtTime(frequency, start);
      gain.gain.setValueAtTime(0.0001, start);
      gain.gain.exponentialRampToValueAtTime(volume, start + 0.012);
      gain.gain.exponentialRampToValueAtTime(0.0001, start + duration);
      oscillator.connect(gain);
      gain.connect(audioContext.destination);
      oscillator.start(start);
      oscillator.stop(start + duration + 0.02);
    }

    function playTick(frequency = 520, volume = 0.025) {
      tone(frequency, 0.055, 0, volume, "square");
    }

    function playStartSound() {
      tone(220, 0.12, 0, 0.035, "triangle");
      tone(330, 0.12, 0.09, 0.035, "triangle");
      tone(440, 0.16, 0.18, 0.04, "triangle");
    }

    function playSoftWin() {
      tone(523.25, 0.18, 0, 0.035, "sine");
      tone(659.25, 0.18, 0.12, 0.035, "sine");
      tone(783.99, 0.28, 0.24, 0.04, "sine");
    }

    function playWinSound() {
      const notes = [392, 523.25, 659.25, 783.99, 1046.5];
      notes.forEach((note, index) => tone(note, index === notes.length - 1 ? 0.5 : 0.22, index * 0.11, 0.055, "triangle"));
      tone(196, 0.5, 0.04, 0.025, "sine");
    }

    soundToggle.addEventListener("click", () => {
      soundEnabled = !soundEnabled;
      soundToggle.setAttribute("aria-pressed", String(soundEnabled));
      soundToggle.querySelector(".sound-icon").src = soundEnabled
        ? "assets/speaker-high.svg"
        : "assets/speaker-slash.svg";
      soundToggle.querySelector(".sound-label").textContent = soundEnabled ? "音效开启" : "音效关闭";
      soundToggle.title = soundEnabled ? "关闭音效" : "开启音效";
      if (soundEnabled) {
        initAudio();
        tone(660, 0.1, 0, 0.035, "sine");
      }
    });
  </script>
</body>

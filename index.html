<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f2eadf">
  <title>今天吃什么 · 今晚喝什么</title>
  <style>
    :root {
      --cream: #f2eadf;
      --paper: #fffaf2;
      --paper-deep: #e8dccb;
      --ink: #342a27;
      --muted: #756965;
      --wine: #8b2f42;
      --wine-dark: #571925;
      --gold: #d4ae67;
      --green: #6f8f70;
      --night: #17151c;
      --night-2: #241d2b;
      --neon-pink: #ff6f91;
      --neon-cyan: #75e6dd;
      --shadow: 0 22px 55px rgba(74, 49, 39, 0.18);
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: var(--cream);
    }

    body {
      min-height: 100vh;
      margin: 0;
      color: var(--ink);
      font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      background:
        radial-gradient(circle at 12% 8%, rgba(255, 255, 255, 0.95), transparent 28%),
        radial-gradient(circle at 88% 18%, rgba(212, 174, 103, 0.16), transparent 26%),
        linear-gradient(145deg, #f5efe7 0%, #eadfd1 100%);
    }

    button {
      font: inherit;
    }

    button:focus-visible,
    [tabindex]:focus-visible {
      outline: 3px solid rgba(139, 47, 66, 0.35);
      outline-offset: 3px;
    }

    .app {
      width: min(1120px, calc(100% - 28px));
      margin: 0 auto;
      padding: 24px 0 42px;
    }

    .app-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 18px;
      padding: 0 4px;
    }

    .brand-kicker {
      margin: 0 0 5px;
      color: var(--wine);
      font-size: 0.75rem;
      font-weight: 900;
      letter-spacing: 0.16em;
    }

    .app-title {
      margin: 0;
      color: var(--wine-dark);
      font-family: Georgia, "Noto Serif SC", serif;
      font-size: 2.1rem;
      line-height: 1;
      letter-spacing: 0;
    }

    .sound-toggle {
      display: inline-grid;
      grid-template-columns: 22px auto;
      align-items: center;
      gap: 7px;
      min-height: 42px;
      padding: 0 14px;
      border: 1px solid rgba(87, 25, 37, 0.15);
      border-radius: 999px;
      color: var(--wine-dark);
      background: rgba(255, 250, 242, 0.82);
      box-shadow: 0 7px 18px rgba(87, 25, 37, 0.1);
      cursor: pointer;
    }

    .sound-toggle:hover {
      background: #fff;
    }

    .sound-icon {
      font-size: 1rem;
      line-height: 1;
    }

    .sound-label {
      font-size: 0.78rem;
      font-weight: 800;
    }

    .tabs {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
      width: min(410px, 100%);
      margin: 0 auto 16px;
      padding: 6px;
      border: 1px solid rgba(87, 25, 37, 0.1);
      border-radius: 999px;
      background: rgba(255, 250, 242, 0.75);
      box-shadow: 0 8px 24px rgba(79, 52, 42, 0.1);
    }

    .tab {
      min-height: 45px;
      border: 0;
      border-radius: 999px;
      color: var(--muted);
      background: transparent;
      font-weight: 900;
      cursor: pointer;
      transition: color 180ms ease, background 180ms ease, box-shadow 180ms ease;
    }

    .tab[aria-selected="true"] {
      color: #fffaf2;
      background: linear-gradient(180deg, #a74458, var(--wine));
      box-shadow: 0 7px 15px rgba(87, 25, 37, 0.22);
    }

    .page-panel {
      display: none;
    }

    .page-panel.is-active {
      display: block;
      animation: panelIn 280ms ease both;
    }

    @keyframes panelIn {
      from { opacity: 0; transform: translateY(7px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Eating slot machine */
    .eat-machine {
      position: relative;
      overflow: hidden;
      padding: 34px;
      border: 1px solid rgba(255, 255, 255, 0.9);
      border-radius: 30px;
      background:
        linear-gradient(160deg, rgba(255, 255, 255, 0.86), rgba(240, 230, 216, 0.94)),
        var(--paper);
      box-shadow: var(--shadow), inset 0 1px 0 #fff;
    }

    .eat-machine::before {
      content: "";
      position: absolute;
      inset: 12px;
      border: 1px solid rgba(139, 47, 66, 0.1);
      border-radius: 22px;
      pointer-events: none;
    }

    .section-heading {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 24px;
    }

    .section-heading h2 {
      margin: 0;
      color: var(--wine-dark);
      font-family: Georgia, "Noto Serif SC", serif;
      font-size: 2rem;
      letter-spacing: 0;
    }

    .section-heading p {
      margin: 7px 0 0;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .mini-badge {
      flex: none;
      padding: 9px 13px;
      border-radius: 999px;
      color: var(--wine-dark);
      background: #fff9ef;
      border: 1px solid rgba(139, 47, 66, 0.12);
      font-size: 0.76rem;
      font-weight: 900;
    }

    .reel-stage {
      position: relative;
      z-index: 1;
      padding: 20px;
      border-radius: 24px;
      border: 1px solid rgba(87, 25, 37, 0.12);
      background: linear-gradient(180deg, #d9c5a9, #bfa688);
      box-shadow:
        inset 0 3px 6px rgba(255, 255, 255, 0.7),
        inset 0 -8px 18px rgba(74, 44, 30, 0.12),
        0 16px 32px rgba(74, 49, 39, 0.13);
    }

    .reels {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
    }

    .reel-column {
      min-width: 0;
    }

    .reel-label {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 34px;
      margin-bottom: 9px;
      border-radius: 999px;
      color: var(--wine-dark);
      background: rgba(255, 250, 242, 0.85);
      font-size: 0.85rem;
      font-weight: 900;
    }

    .reel-window {
      position: relative;
      height: 218px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.9);
      border-radius: 18px;
      background: var(--paper);
      box-shadow: inset 0 0 0 1px rgba(87, 25, 37, 0.06), 0 10px 20px rgba(68, 44, 35, 0.14);
      touch-action: none;
    }

    .reel-window::before,
    .reel-window::after {
      content: "";
      position: absolute;
      z-index: 4;
      left: 0;
      right: 0;
      height: 23%;
      pointer-events: none;
    }

    .reel-window::before {
      top: 0;
      background: linear-gradient(#e7ded1, rgba(255, 250, 242, 0));
    }

    .reel-window::after {
      bottom: 0;
      background: linear-gradient(to top, #e7ded1, rgba(255, 250, 242, 0));
    }

    .reel-track {
      will-change: transform;
    }

    .reel-item {
      height: 218px;
      display: grid;
      place-items: center;
      align-content: center;
      gap: 9px;
      padding: 16px 8px;
    }

    .dish-art {
      position: relative;
      width: 126px;
      height: 126px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background:
        radial-gradient(circle at 37% 30%, #fffef9 0 12%, transparent 13%),
        linear-gradient(155deg, #fffdf8, #e0d4c4);
      border: 1px solid #d6c8b6;
      box-shadow: 0 13px 20px rgba(77, 49, 37, 0.18), inset 0 -8px 14px rgba(107, 75, 57, 0.08);
    }

    .dish-art::before {
      content: "";
      position: absolute;
      inset: 16px;
      border-radius: 50%;
      background: var(--dish-bg, #d8b374);
      border: 4px solid rgba(255, 255, 255, 0.65);
      box-shadow: inset 0 8px 15px rgba(255, 255, 255, 0.18);
    }

    .dish-icon {
      position: relative;
      z-index: 1;
      font-size: 3.8rem;
      line-height: 1;
      filter: drop-shadow(0 6px 5px rgba(72, 43, 28, 0.18));
    }

    .dish-name {
      max-width: 100%;
      color: #382d2a;
      font-size: 1rem;
      font-weight: 900;
      text-align: center;
      line-height: 1.2;
    }

    .reel-arrow {
      position: absolute;
      z-index: 7;
      left: 50%;
      width: 34px;
      height: 25px;
      transform: translateX(-50%);
      border: 0;
      border-radius: 999px;
      color: #fff;
      background: rgba(87, 25, 37, 0.76);
      cursor: pointer;
      opacity: 0;
      transition: opacity 160ms ease, background 160ms ease;
    }

    .reel-window:hover .reel-arrow,
    .reel-window:focus-within .reel-arrow {
      opacity: 1;
    }

    .reel-arrow:hover {
      background: var(--wine-dark);
    }

    .reel-arrow.up { top: 7px; }
    .reel-arrow.down { bottom: 7px; }

    .eat-controls {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      margin-top: 24px;
    }

    .primary-button {
      min-width: 190px;
      min-height: 58px;
      padding: 0 28px;
      border: 0;
      border-radius: 999px;
      color: #fffaf2;
      background: linear-gradient(180deg, #aa465b, var(--wine) 58%, var(--wine-dark));
      box-shadow: 0 8px 0 #42101a, 0 15px 24px rgba(87, 25, 37, 0.24), inset 0 2px 1px rgba(255, 255, 255, 0.3);
      font-size: 1.05rem;
      font-weight: 950;
      cursor: pointer;
      transition: transform 120ms ease, box-shadow 120ms ease;
    }

    .primary-button:hover {
      transform: translateY(-2px);
    }

    .primary-button:active {
      transform: translateY(5px);
      box-shadow: 0 3px 0 #42101a, 0 8px 14px rgba(87, 25, 37, 0.2);
    }

    .primary-button:disabled {
      cursor: wait;
      filter: saturate(0.72);
    }

    .menu-result {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 18px;
      color: var(--muted);
      font-size: 0.82rem;
    }

    .menu-result strong {
      color: var(--wine-dark);
    }

    .result-chip {
      padding: 8px 12px;
      border-radius: 999px;
      color: var(--ink);
      background: #fffaf2;
      border: 1px solid rgba(87, 25, 37, 0.08);
      box-shadow: 0 5px 12px rgba(74, 49, 39, 0.08);
      font-weight: 900;
    }

    /* Night bar lottery */
    .drink-scene {
      position: relative;
      overflow: hidden;
      min-height: 690px;
      padding: 30px 30px 40px;
      border-radius: 30px;
      color: #fff8ed;
      background:
        linear-gradient(rgba(18, 15, 23, 0.18), rgba(18, 15, 23, 0.92)),
        repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.025) 0 1px, transparent 1px 55px),
        linear-gradient(145deg, #2a2030 0%, #131219 66%, #1d171e 100%);
      box-shadow: 0 28px 68px rgba(34, 22, 29, 0.35);
      isolation: isolate;
    }

    .drink-scene::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      background:
        radial-gradient(circle at 22% 16%, rgba(255, 111, 145, 0.16), transparent 26%),
        radial-gradient(circle at 78% 20%, rgba(117, 230, 221, 0.13), transparent 25%);
    }

    .bar-shelf {
      position: absolute;
      top: 94px;
      left: 5%;
      right: 5%;
      height: 88px;
      border-bottom: 8px solid #4a3030;
      opacity: 0.6;
      pointer-events: none;
    }

    .bottle {
      position: absolute;
      bottom: 8px;
      width: 20px;
      border-radius: 5px 5px 2px 2px;
      background: linear-gradient(90deg, rgba(255, 255, 255, 0.2), var(--bottle-color, #627b65));
      box-shadow: 0 0 13px var(--bottle-glow, rgba(117, 230, 221, 0.2));
    }

    .bottle::before {
      content: "";
      position: absolute;
      left: 6px;
      top: -13px;
      width: 8px;
      height: 16px;
      border-radius: 2px 2px 0 0;
      background: inherit;
    }

    .bottle:nth-child(1) { left: 3%; height: 46px; }
    .bottle:nth-child(2) { left: 10%; height: 60px; --bottle-color: #90513a; }
    .bottle:nth-child(3) { left: 18%; height: 53px; --bottle-color: #557b83; }
    .bottle:nth-child(4) { right: 18%; height: 57px; --bottle-color: #925f3b; }
    .bottle:nth-child(5) { right: 10%; height: 49px; --bottle-color: #607953; }
    .bottle:nth-child(6) { right: 3%; height: 63px; --bottle-color: #7c4569; }

    .neon-title {
      position: relative;
      z-index: 2;
      margin: 0;
      text-align: center;
      color: #fff4e8;
      font-family: Georgia, "Noto Serif SC", serif;
      font-size: 2rem;
      letter-spacing: 0;
      text-shadow:
        0 0 6px rgba(255, 111, 145, 0.85),
        0 0 18px rgba(255, 111, 145, 0.55),
        0 0 35px rgba(255, 111, 145, 0.28);
    }

    .neon-subtitle {
      position: relative;
      z-index: 2;
      margin: 7px 0 22px;
      color: #cfc4cc;
      text-align: center;
      font-size: 0.84rem;
    }

    .lottery-cabinet {
      position: relative;
      z-index: 3;
      width: min(650px, 100%);
      margin: 0 auto;
      padding: 38px 42px 34px;
      border: 5px solid #6a3d45;
      border-radius: 28px;
      background:
        linear-gradient(145deg, rgba(255, 255, 255, 0.13), transparent 18%),
        linear-gradient(160deg, #a86069, #6f3541 55%, #4a222c);
      box-shadow:
        0 22px 48px rgba(0, 0, 0, 0.48),
        inset 0 0 0 3px rgba(255, 225, 188, 0.13),
        inset 0 -15px 25px rgba(40, 9, 18, 0.25);
    }

    .lottery-cabinet::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: -29px;
      width: 74%;
      height: 28px;
      transform: translateX(-50%);
      border-radius: 0 0 14px 14px;
      background: linear-gradient(#51242e, #30151b);
      box-shadow: 0 13px 24px rgba(0, 0, 0, 0.35);
    }

    .cabinet-sign {
      position: absolute;
      top: -19px;
      left: 50%;
      z-index: 3;
      transform: translateX(-50%);
      padding: 8px 23px;
      border: 2px solid #e6c17e;
      border-radius: 999px;
      color: #ffe9b2;
      background: #3c1722;
      box-shadow: 0 0 18px rgba(255, 197, 104, 0.32);
      font-size: 0.75rem;
      font-weight: 950;
      white-space: nowrap;
    }

    .lights {
      position: absolute;
      z-index: 8;
      display: flex;
      justify-content: space-around;
      pointer-events: none;
    }

    .lights.horizontal {
      left: 14px;
      right: 14px;
      height: 14px;
    }

    .lights.top { top: 8px; }
    .lights.bottom { bottom: 8px; }

    .lights.vertical {
      top: 22px;
      bottom: 22px;
      width: 14px;
      flex-direction: column;
    }

    .lights.left { left: 8px; }
    .lights.right { right: 8px; }

    .bulb {
      width: 9px;
      height: 9px;
      flex: none;
      border-radius: 50%;
      background: #7d5858;
      box-shadow: inset 0 1px 2px rgba(255, 255, 255, 0.25), 0 0 0 2px rgba(45, 14, 21, 0.2);
    }

    .drink-scene.is-mixing .bulb {
      animation: chaseLight 480ms infinite;
      animation-delay: calc(var(--i) * -38ms);
    }

    .drink-scene.is-winning .bulb {
      animation: winLight 240ms infinite alternate;
      animation-delay: calc(var(--i) * -24ms);
    }

    @keyframes chaseLight {
      0%, 42%, 100% {
        background: #775354;
        box-shadow: 0 0 0 2px rgba(45, 14, 21, 0.2);
      }
      48%, 75% {
        background: #fff0a8;
        box-shadow: 0 0 7px #ffd05b, 0 0 15px rgba(255, 173, 73, 0.9);
      }
    }

    @keyframes winLight {
      from {
        background: #fff3ad;
        box-shadow: 0 0 8px #ffd56c, 0 0 18px rgba(255, 111, 145, 0.85);
      }
      to {
        background: #78eee5;
        box-shadow: 0 0 9px #75e6dd, 0 0 20px rgba(117, 230, 221, 0.85);
      }
    }

    .dome {
      position: relative;
      height: 310px;
      overflow: hidden;
      border: 4px solid rgba(255, 234, 210, 0.78);
      border-radius: 48% 48% 31% 31% / 44% 44% 23% 23%;
      background:
        linear-gradient(110deg, rgba(255, 255, 255, 0.24) 0 8%, transparent 9% 73%, rgba(255, 255, 255, 0.08) 74% 81%, transparent 82%),
        radial-gradient(circle at 50% 105%, rgba(255, 111, 145, 0.23), transparent 48%),
        rgba(33, 30, 42, 0.62);
      box-shadow:
        inset 0 0 45px rgba(0, 0, 0, 0.32),
        inset 0 0 0 6px rgba(255, 255, 255, 0.06),
        0 0 18px rgba(255, 198, 133, 0.18);
      backdrop-filter: blur(3px);
    }

    .dome::after {
      content: "";
      position: absolute;
      left: 10%;
      right: 10%;
      bottom: 15px;
      height: 24px;
      border-radius: 50%;
      background: rgba(12, 10, 16, 0.35);
      filter: blur(7px);
    }

    .lottery-ball {
      --x: 0px;
      --y: 0px;
      --delay: 0ms;
      position: absolute;
      z-index: 2;
      left: calc(50% - 43px);
      top: calc(50% - 43px);
      width: 86px;
      height: 86px;
      display: grid;
      place-items: center;
      padding: 9px;
      transform: translate(var(--x), var(--y));
      border: 3px solid rgba(255, 255, 255, 0.65);
      border-radius: 50%;
      color: #352726;
      background:
        radial-gradient(circle at 31% 25%, rgba(255, 255, 255, 0.95) 0 8%, transparent 9%),
        linear-gradient(145deg, var(--ball-light), var(--ball-dark));
      box-shadow:
        inset -8px -10px 14px rgba(65, 32, 30, 0.14),
        0 9px 13px rgba(0, 0, 0, 0.3);
      text-align: center;
      font-size: 0.76rem;
      font-weight: 950;
      line-height: 1.15;
      transition: transform 500ms cubic-bezier(0.2, 0.72, 0.25, 1), opacity 180ms ease;
    }

    .lottery-ball::after {
      content: attr(data-number);
      position: absolute;
      top: 6px;
      right: 9px;
      width: 18px;
      height: 18px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      color: rgba(53, 39, 38, 0.65);
      background: rgba(255, 255, 255, 0.45);
      font-size: 0.62rem;
    }

    .drink-scene.is-mixing .lottery-ball {
      animation: ballMix 700ms cubic-bezier(0.36, 0, 0.64, 1) infinite alternate;
      animation-delay: var(--delay);
    }

    @keyframes ballMix {
      0% {
        transform: translate(var(--x), var(--y)) rotate(-12deg) scale(0.96);
      }
      45% {
        transform: translate(
          calc(var(--x) + var(--swing-x)),
          calc(var(--y) - var(--lift))
        ) rotate(25deg) scale(1.04);
      }
      100% {
        transform: translate(
          calc(var(--x) - var(--swing-x)),
          calc(var(--y) + 24px)
        ) rotate(66deg) scale(0.98);
      }
    }

    .machine-neck {
      position: relative;
      width: 94px;
      height: 55px;
      margin: -1px auto 0;
      border: 3px solid #b98575;
      border-top: 0;
      border-radius: 0 0 20px 20px;
      background: linear-gradient(90deg, #4b202a, #8c4b56 50%, #4b202a);
      box-shadow: inset 0 -8px 10px rgba(0, 0, 0, 0.22);
    }

    .drawn-ball-wrap {
      position: relative;
      z-index: 4;
      width: 152px;
      height: 112px;
      margin: -7px auto 0;
      display: grid;
      place-items: center;
      border: 3px solid #c4947c;
      border-radius: 17px;
      background: linear-gradient(180deg, #391b22, #211016);
      box-shadow: inset 0 12px 18px rgba(0, 0, 0, 0.35), 0 9px 20px rgba(0, 0, 0, 0.28);
    }

    .drawn-ball {
      width: 78px;
      height: 78px;
      display: grid;
      place-items: center;
      padding: 8px;
      border: 3px solid rgba(255, 255, 255, 0.72);
      border-radius: 50%;
      color: #342827;
      background:
        radial-gradient(circle at 31% 25%, rgba(255, 255, 255, 0.95) 0 8%, transparent 9%),
        linear-gradient(145deg, #f6df8a, #d68b67);
      box-shadow: inset -8px -10px 13px rgba(65, 32, 30, 0.13), 0 8px 16px rgba(0, 0, 0, 0.35);
      font-size: 0.75rem;
      font-weight: 950;
      line-height: 1.15;
      text-align: center;
    }

    .drawn-ball.is-dropping {
      animation: ballDrop 720ms cubic-bezier(0.18, 0.76, 0.24, 1.22) both;
    }

    @keyframes ballDrop {
      0% { opacity: 0; transform: translateY(-125px) scale(0.56) rotate(-120deg); }
      68% { opacity: 1; transform: translateY(7px) scale(1.08) rotate(12deg); }
      100% { transform: translateY(0) scale(1) rotate(0); }
    }

    .drink-control {
      position: relative;
      z-index: 5;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 11px;
      margin-top: 42px;
    }

    .draw-button {
      min-width: 210px;
      min-height: 61px;
      padding: 0 30px;
      border: 2px solid #ffd58a;
      border-radius: 999px;
      color: #fff6e8;
      background:
        radial-gradient(circle at 35% 20%, rgba(255, 255, 255, 0.25), transparent 24%),
        linear-gradient(180deg, #d4526c, #922e48 62%, #5c1a2e);
      box-shadow:
        0 8px 0 #3b1020,
        0 0 18px rgba(255, 111, 145, 0.36),
        0 16px 28px rgba(0, 0, 0, 0.34),
        inset 0 2px 1px rgba(255, 255, 255, 0.28);
      font-size: 1.06rem;
      font-weight: 950;
      cursor: pointer;
      transition: transform 120ms ease, filter 180ms ease;
    }

    .draw-button:hover {
      transform: translateY(-2px);
      filter: brightness(1.07);
    }

    .draw-button:active {
      transform: translateY(6px);
      box-shadow: 0 2px 0 #3b1020, 0 0 16px rgba(255, 111, 145, 0.3);
    }

    .draw-button:disabled {
      cursor: wait;
      filter: saturate(0.68);
    }

    .drink-result-line {
      min-height: 24px;
      margin: 0;
      color: #d7cbd2;
      font-size: 0.82rem;
      text-align: center;
    }

    .drink-result-line strong {
      color: #ffe3a5;
    }

    .bar-counter {
      position: absolute;
      z-index: 1;
      left: -2%;
      right: -2%;
      bottom: -2px;
      height: 74px;
      border-top: 9px solid #67413a;
      background:
        linear-gradient(90deg, transparent 0 7%, rgba(255, 255, 255, 0.04) 7% 7.5%, transparent 7.5% 19%),
        linear-gradient(#402a28, #211719);
      box-shadow: 0 -10px 30px rgba(0, 0, 0, 0.35);
    }

    /* Winner modal */
    .win-modal {
      position: fixed;
      z-index: 50;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 20px;
      background: rgba(17, 12, 17, 0.72);
      backdrop-filter: blur(7px);
      opacity: 0;
      visibility: hidden;
      transition: opacity 220ms ease, visibility 220ms ease;
    }

    .win-modal.is-open {
      opacity: 1;
      visibility: visible;
    }

    .win-dialog {
      position: relative;
      width: min(430px, 100%);
      overflow: hidden;
      padding: 32px 26px 26px;
      border: 3px solid #e5bd73;
      border-radius: 24px;
      color: #38262b;
      background:
        radial-gradient(circle at 50% -20%, rgba(255, 255, 255, 0.95), transparent 48%),
        linear-gradient(160deg, #fff8e9, #ead8bf);
      box-shadow:
        0 0 0 8px rgba(111, 53, 65, 0.5),
        0 0 35px rgba(255, 198, 107, 0.35),
        0 28px 70px rgba(0, 0, 0, 0.48);
      text-align: center;
      transform: translateY(18px) scale(0.92);
      transition: transform 320ms cubic-bezier(0.2, 0.88, 0.3, 1.15);
    }

    .win-modal.is-open .win-dialog {
      transform: translateY(0) scale(1);
    }

    .win-dialog::before {
      content: "";
      position: absolute;
      inset: 9px;
      border: 1px solid rgba(139, 47, 66, 0.14);
      border-radius: 16px;
      pointer-events: none;
    }

    .modal-close {
      position: absolute;
      z-index: 2;
      top: 12px;
      right: 12px;
      width: 36px;
      height: 36px;
      border: 0;
      border-radius: 50%;
      color: var(--wine-dark);
      background: rgba(255, 255, 255, 0.62);
      font-size: 1.25rem;
      cursor: pointer;
    }

    .modal-close:hover {
      background: #fff;
    }

    .win-kicker {
      position: relative;
      z-index: 1;
      margin: 0 0 10px;
      color: var(--wine);
      font-size: 0.76rem;
      font-weight: 950;
      letter-spacing: 0.14em;
    }

    .win-glass {
      position: relative;
      z-index: 1;
      width: 118px;
      height: 118px;
      display: grid;
      place-items: center;
      margin: 0 auto 13px;
      border-radius: 50%;
      color: #fff;
      background:
        radial-gradient(circle at 34% 27%, rgba(255, 255, 255, 0.42) 0 8%, transparent 9%),
        linear-gradient(145deg, #ae4058, #5f1b2d);
      box-shadow: 0 13px 25px rgba(87, 25, 37, 0.22), inset 0 -10px 18px rgba(41, 7, 16, 0.2);
      font-size: 3.5rem;
    }

    .win-dialog h3 {
      position: relative;
      z-index: 1;
      margin: 0;
      color: var(--wine-dark);
      font-family: Georgia, "Noto Serif SC", serif;
      font-size: 1.95rem;
      letter-spacing: 0;
    }

    .win-note {
      position: relative;
      z-index: 1;
      margin: 10px auto 20px;
      max-width: 320px;
      color: #78635f;
      font-size: 0.88rem;
      line-height: 1.65;
    }

    .modal-actions {
      position: relative;
      z-index: 1;
      display: flex;
      justify-content: center;
      gap: 10px;
    }

    .modal-button {
      min-height: 44px;
      padding: 0 18px;
      border-radius: 999px;
      font-size: 0.86rem;
      font-weight: 900;
      cursor: pointer;
    }

    .modal-button.secondary {
      border: 1px solid rgba(87, 25, 37, 0.2);
      color: var(--wine-dark);
      background: rgba(255, 255, 255, 0.54);
    }

    .modal-button.primary {
      border: 0;
      color: #fffaf2;
      background: linear-gradient(180deg, #a9475b, var(--wine));
      box-shadow: 0 6px 13px rgba(87, 25, 37, 0.2);
    }

    .confetti {
      position: fixed;
      z-index: 51;
      top: -18px;
      width: 9px;
      height: 14px;
      border-radius: 2px;
      pointer-events: none;
      animation: confettiFall var(--fall-time) linear forwards;
    }

    @keyframes confettiFall {
      0% { transform: translate3d(0, -10px, 0) rotate(0); opacity: 1; }
      100% { transform: translate3d(var(--drift), 105vh, 0) rotate(720deg); opacity: 0.92; }
    }

    @media (max-width: 760px) {
      .app {
        width: min(100% - 18px, 1120px);
        padding-top: 13px;
      }

      .app-header {
        align-items: flex-start;
      }

      .app-title {
        font-size: 1.65rem;
      }

      .sound-toggle {
        grid-template-columns: 20px;
        min-width: 42px;
        padding: 0 10px;
      }

      .sound-label {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
      }

      .eat-machine,
      .drink-scene {
        border-radius: 22px;
      }

      .eat-machine {
        padding: 24px 12px 22px;
      }

      .eat-machine::before {
        inset: 7px;
        border-radius: 16px;
      }

      .section-heading {
        margin-bottom: 18px;
        padding: 0 5px;
      }

      .section-heading h2,
      .neon-title {
        font-size: 1.55rem;
      }

      .section-heading p {
        font-size: 0.77rem;
      }

      .mini-badge {
        padding: 7px 9px;
        font-size: 0.66rem;
      }

      .reel-stage {
        padding: 11px 7px;
        border-radius: 19px;
      }

      .reels {
        gap: 5px;
      }

      .reel-label {
        height: 30px;
        font-size: 0.74rem;
      }

      .reel-window,
      .reel-item {
        height: 178px;
      }

      .reel-window {
        border-radius: 13px;
      }

      .dish-art {
        width: 88px;
        height: 88px;
      }

      .dish-art::before {
        inset: 11px;
      }

      .dish-icon {
        font-size: 2.7rem;
      }

      .dish-name {
        font-size: 0.78rem;
      }

      .reel-arrow {
        display: none;
      }

      .primary-button {
        min-width: 178px;
        min-height: 54px;
      }

      .menu-result {
        padding: 0 4px;
      }

      .result-chip {
        padding: 7px 9px;
        font-size: 0.75rem;
      }

      .drink-scene {
        min-height: 645px;
        padding: 24px 10px 34px;
      }

      .bar-shelf {
        top: 76px;
      }

      .lottery-cabinet {
        width: calc(100% - 8px);
        padding: 34px 25px 28px;
        border-width: 4px;
      }

      .dome {
        height: 285px;
      }

      .lottery-ball {
        left: calc(50% - 36px);
        top: calc(50% - 36px);

      }

    @media (max-width: 390px) {

      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        animation-duration: 1ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 1ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="app-header">
      <div>
        <p class="brand-kicker">DAILY CHOICE CLUB</p>
        <h1 class="app-title">今天选点什么</h1>
      </div>
      <button class="sound-toggle" id="soundToggle" type="button" aria-pressed="true" title="关闭音效">
        <span class="sound-icon" aria-hidden="true">🔊</span>
        <span class="sound-label">音效开启</span>
      </button>
    </header>

    <nav class="tabs" role="tablist" aria-label="选择吃什么或喝什么">
      <button class="tab" id="eatTab" type="button" role="tab" aria-controls="eatPanel" aria-selected="true">吃什么</button>
      <button class="tab" id="drinkTab" type="button" role="tab" aria-controls="drinkPanel" aria-selected="false">喝什么</button>
    </nav>

    <section class="page-panel is-active" id="eatPanel" role="tabpanel" aria-labelledby="eatTab">
      <div class="eat-machine">
        <header class="section-heading">
          <div>
            <h2>今天吃什么</h2>
            <p>上下滑动自由选择，或让三个滚轮替你决定。</p>
          </div>
          <span class="mini-badge">一餐 · 三选</span>
        </header>

        <div class="reel-stage">
          <div class="reels" id="foodReels"></div>
        </div>

        <div class="eat-controls">
          <button class="primary-button" id="foodSpinButton" type="button">随机生成</button>
        </div>

        <div class="menu-result" aria-live="polite">
          <strong>当前菜单</strong>
          <span class="result-chip" id="stapleResult">杂粮饭</span>
          <span>+</span>
          <span class="result-chip" id="mainResult">鸡蛋肉沫</span>
          <span>+</span>
          <span class="result-chip" id="vegResult">白灼生菜</span>
        </div>
      </div>
    </section>

    <section class="page-panel" id="drinkPanel" role="tabpanel" aria-labelledby="drinkTab" hidden>
      <div class="drink-scene" id="drinkScene">
        <div class="bar-shelf" aria-hidden="true">
          <i class="bottle"></i>
          <i class="bottle"></i>
          <i class="bottle"></i>
          <i class="bottle"></i>
          <i class="bottle"></i>
          <i class="bottle"></i>
        </div>

        <h2 class="neon-title">今晚喝什么</h2>
        <p class="neon-subtitle">按下按钮，让夜晚交给一点运气。</p>

        <div class="lottery-cabinet" id="lotteryCabinet">
          <div class="cabinet-sign">LUCKY NIGHT DRAW</div>
          <div class="lights horizontal top" aria-hidden="true"></div>
          <div class="lights horizontal bottom" aria-hidden="true"></div>
          <div class="lights vertical left" aria-hidden="true"></div>
          <div class="lights vertical right" aria-hidden="true"></div>

          <div class="dome" id="lotteryDome" aria-label="酒类小球抽奖机"></div>
          <div class="machine-neck" aria-hidden="true"></div>
          <div class="drawn-ball-wrap">
            <div class="drawn-ball" id="drawnBall">待开奖</div>
          </div>
        </div>

        <div class="drink-control">
          <button class="draw-button" id="drawButton" type="button">立即开喝</button>
          <p class="drink-result-line" id="drinkResult" aria-live="polite">今晚的第一杯，还在抽奖机里。</p>
        </div>

        <div class="bar-counter" aria-hidden="true"></div>

    </section>
  </main>

  <div class="win-modal" id="winModal" role="dialog" aria-modal="true" aria-labelledby="winTitle" aria-hidden="true">
    <div class="win-dialog">
      <button class="modal-close" id="modalClose" type="button" aria-label="关闭中奖弹窗">×</button>
      <p class="win-kicker">TONIGHT'S WINNER</p>
      <div class="win-glass" id="winGlass" aria-hidden="true">🍺</div>
      <h3 id="winTitle">啤酒</h3>
      <p class="win-note" id="winNote">轻松开场，冰镇之后更适合今晚。</p>
      <div class="modal-actions">
        <button class="modal-button secondary" id="acceptDrink" type="button">就喝这个</button>
        <button class="modal-button primary" id="drawAgain" type="button">再抽一次</button>
      </div>
    </div>
  </div>

  <script>
    const foodData = [
      {
        key: "staple",
        label: "主食",
        resultId: "stapleResult",
        items: [
          { name: "杂粮饭", icon: "🍚", color: "#b88759" },
          { name: "白米饭", icon: "🍚", color: "#eee3cf" },
          { name: "馒头", icon: "🥟", color: "#e8d4b5" },
          { name: "土豆", icon: "🥔", color: "#d4a44e" }
        ]
      },
      {
        key: "main",
        label: "主菜",
        resultId: "mainResult",
        items: [
          { name: "鸡蛋肉沫", icon: "🍳", color: "#c35f42" },
          { name: "青椒鸡丁", icon: "🍗", color: "#72a052" },
          { name: "红三剁", icon: "🍅", color: "#c94d3c" },
          { name: "青椒虾滑", icon: "🍤", color: "#79a95b" },
          { name: "洋葱牛肉", icon: "🥩", color: "#a86550" }
        ]
      },
      {
        key: "veg",
        label: "蔬菜",
        resultId: "vegResult",
        items: [
          { name: "白灼生菜", icon: "🥬", color: "#81b764" },
          { name: "白灼芦笋", icon: "🌿", color: "#65a36b" },
          { name: "清炒空心菜", icon: "🥬", color: "#50955d" },
          { name: "清炒杭白菜", icon: "🥬", color: "#9abb70" }
        ]
      }
    ];

    const drinks = [
      {
        name: "啤酒",
        icon: "🍺",
        note: "轻松开场，冰镇之后更适合今晚。",
        light: "#f8dc75",
        dark: "#d99b3f"
      },
      {
        name: "金汤力",
        icon: "🍸",
        note: "清爽、微苦、带一点柑橘香，适合慢慢进入状态。",
        light: "#d9f5d6",
        dark: "#8cc6a5"
      },
      {
        name: "自由古巴",
        icon: "🥃",
        note: "朗姆、可乐与青柠的组合，今晚走轻松热闹路线。",
        light: "#d7a36b",
        dark: "#9a5845"
      },
      {
        name: "长岛冰茶",
        icon: "🍹",
        note: "看起来温和，实际酒精度不低，记得放慢速度。",
        light: "#efc982",
        dark: "#bd7c5b"
      },
      {
        name: "威士忌纯饮",
        icon: "🥃",
        note: "不加修饰，让木桶香和余味成为今晚的主角。",
        light: "#d49254",
        dark: "#8f4938"
      },
      {
        name: "白酒纯饮",
        icon: "🍶",
        note: "小杯慢饮，配点下酒菜，也别忘了补水。",
        light: "#e4d6f0",
        dark: "#a494bc"
      }
    ];

    const wait = (ms) => new Promise(resolve => setTimeout(resolve, ms));
    const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    class FoodReel {
      constructor(group) {
        this.group = group;
        this.index = 0;
        this.virtualIndex = group.items.length * 5;
        this.itemHeight = window.innerWidth <= 390 ? 166 : window.innerWidth <= 760 ? 178 : 218;
        this.busy = false;
        this.dragging = false;
        this.build();
        this.bind();
        this.render(0);
        this.updateResult();
      }

      build() {
        const column = document.createElement("section");
        column.className = "reel-column";
        column.innerHTML = `
          <div class="reel-label">${this.group.label}</div>
          <div class="reel-window" tabindex="0" role="listbox" aria-label="${this.group.label}，可上下滑动选择">
            <button class="reel-arrow up" type="button" aria-label="${this.group.label}上一项">▲</button>
            <button class="reel-arrow down" type="button" aria-label="${this.group.label}下一项">▼</button>
            <div class="reel-track"></div>
          </div>
        `;
        document.getElementById("foodReels").appendChild(column);
        this.window = column.querySelector(".reel-window");
        this.track = column.querySelector(".reel-track");

        const repeated = [];
        for (let copy = 0; copy < 11; copy += 1) {
          this.group.items.forEach(item => {
            repeated.push(`
              <div class="reel-item" role="option">
                <div class="dish-art" style="--dish-bg:${item.color}">
                  <span class="dish-icon" aria-hidden="true">${item.icon}</span>
                </div>
                <div class="dish-name">${item.name}</div>
              </div>
            `);
          });
        }
        this.track.innerHTML = repeated.join("");
      }

      bind() {
        this.window.querySelector(".up").addEventListener("click", event => {
          event.stopPropagation();
          this.step(-1);
        });
        this.window.querySelector(".down").addEventListener("click", event => {
          event.stopPropagation();
          this.step(1);
        });
        this.window.addEventListener("wheel", event => {
          if (this.busy) return;
          event.preventDefault();
          this.step(event.deltaY > 0 ? 1 : -1);
        }, { passive: false });
        this.window.addEventListener("keydown", event => {
          if (event.key === "ArrowUp" || event.key === "ArrowDown") {
            event.preventDefault();
            this.step(event.key === "ArrowDown" ? 1 : -1);
          }
        });
        this.window.addEventListener("pointerdown", event => {
          if (this.busy) return;
          this.dragging = true;
          this.pointerId = event.pointerId;
          this.startY = event.clientY;
          this.window.setPointerCapture?.(event.pointerId);
        });
        this.window.addEventListener("pointerup", event => {
          if (!this.dragging || event.pointerId !== this.pointerId) return;
          this.dragging = false;
          const distance = event.clientY - this.startY;
          if (Math.abs(distance) > 24) this.step(distance < 0 ? 1 : -1);
        });
        this.window.addEventListener("pointercancel", () => {
          this.dragging = false;
        });
        window.addEventListener("resize", () => {
          this.itemHeight = window.innerWidth <= 390 ? 166 : window.innerWidth <= 760 ? 178 : 218;
          this.render(0);
        });
      }

      selectedIndex() {
        const length = this.group.items.length;
        return ((this.virtualIndex % length) + length) % length;
      }

      render(duration = 220) {
        this.track.style.transition = duration ? `transform ${duration}ms cubic-bezier(.2,.75,.2,1)` : "none";
        this.track.style.transform = `translate3d(0, ${-this.virtualIndex * this.itemHeight}px, 0)`;
      }

      updateResult() {
        const item = this.group.items[this.selectedIndex()];
        document.getElementById(this.group.resultId).textContent = item.name;
      }

      normalize() {
        this.virtualIndex = this.group.items.length * 5 + this.selectedIndex();
        this.render(0);
      }

      step(direction) {
        if (this.busy) return;
        this.virtualIndex += direction;
        this.render();
        this.updateResult();
        window.setTimeout(() => this.normalize(), 250);
      }

      async spinTo(target, loops) {
        this.busy = true;
        const distance = ((target - this.selectedIndex()) + this.group.items.length) % this.group.items.length;
        const steps = loops * this.group.items.length + distance;

        for (let step = 0; step < steps; step += 1) {
          this.virtualIndex += 1;
          const progress = (step + 1) / steps;
          const duration = reduceMotion ? 1 : progress < 0.65 ? 62 : 62 + Math.pow((progress - 0.65) / 0.35, 2) * 230;
          this.render(duration);
          this.updateResult();
          if (soundEnabled && step % 2 === 0) playTick(520 + step * 4, 0.022);
          await wait(duration + 6);
        }

        this.busy = false;
        this.normalize();
      }
    }

    const foodReels = foodData.map(group => new FoodReel(group));
    const foodSpinButton = document.getElementById("foodSpinButton");

    foodSpinButton.addEventListener("click", async () => {
      if (foodReels.some(reel => reel.busy)) return;
      initAudio();
      foodSpinButton.disabled = true;
      foodSpinButton.textContent = "正在生成…";
      playStartSound();

      const targets = foodReels.map(reel => Math.floor(Math.random() * reel.group.items.length));
      await Promise.all([
        foodReels[0].spinTo(targets[0], 2),
        foodReels[1].spinTo(targets[1], 3),
        foodReels[2].spinTo(targets[2], 4)
      ]);

      playSoftWin();
      foodSpinButton.textContent = "再来一次";
      foodSpinButton.disabled = false;
    });

    /* Tabs */
    const tabs = [...document.querySelectorAll(".tab")];
    const panels = [...document.querySelectorAll(".page-panel")];

    tabs.forEach(tab => {
      tab.addEventListener("click", () => {
        tabs.forEach(item => item.setAttribute("aria-selected", String(item === tab)));
        panels.forEach(panel => {
          const active = panel.id === tab.getAttribute("aria-controls");
          panel.hidden = !active;
          panel.classList.toggle("is-active", active);
        });
      });
    });

    /* Lights and lottery balls */
    document.querySelectorAll(".lights").forEach((row, rowIndex) => {
      const count = row.classList.contains("horizontal") ? 12 : 8;
      for (let i = 0; i < count; i += 1) {
        const bulb = document.createElement("span");
        bulb.className = "bulb";
        bulb.style.setProperty("--i", String(i + rowIndex * 4));
        row.appendChild(bulb);
      }
    });

    const dome = document.getElementById("lotteryDome");
    const desktopPositions = [
      [-146, 70], [-70, 84], [18, 80], [98, 64], [-115, 0], [-28, 10]
    ];
    const mobilePositions = [
      [-102, 75], [-42, 85], [24, 80], [80, 65], [-75, 5], [-10, 12]
    ];

    drinks.forEach((drink, index) => {
      const ball = document.createElement("div");
      ball.className = "lottery-ball";
      ball.dataset.number = String(index + 1).padStart(2, "0");
      ball.dataset.index = String(index);
      ball.textContent = drink.name;
      ball.style.setProperty("--ball-light", drink.light);
      ball.style.setProperty("--ball-dark", drink.dark);
      ball.style.setProperty("--delay", `${index * -95}ms`);
      ball.style.setProperty("--swing-x", `${index % 2 === 0 ? 48 : -48}px`);
      ball.style.setProperty("--lift", `${58 + index * 4}px`);
      dome.appendChild(ball);
    });

    function positionBalls() {
      const positions = window.innerWidth <= 760 ? mobilePositions : desktopPositions;
      dome.querySelectorAll(".lottery-ball").forEach((ball, index) => {
        ball.style.setProperty("--x", `${positions[index][0]}px`);
        ball.style.setProperty("--y", `${positions[index][1]}px`);
      });
    }

    positionBalls();
    window.addEventListener("resize", positionBalls);

    const drinkScene = document.getElementById("drinkScene");
    const drawButton = document.getElementById("drawButton");
    const drawnBall = document.getElementById("drawnBall");
    const drinkResult = document.getElementById("drinkResult");
    const winModal = document.getElementById("winModal");
    const winTitle = document.getElementById("winTitle");
    const winNote = document.getElementById("winNote");
    const winGlass = document.getElementById("winGlass");
    const modalClose = document.getElementById("modalClose");
    const acceptDrink = document.getElementById("acceptDrink");
    const drawAgain = document.getElementById("drawAgain");
    let drawing = false;

    async function drawDrink() {
      if (drawing) return;
      drawing = true;
      initAudio();
      closeModal();
      clearConfetti();
      drinkScene.classList.remove("is-winning");
      drinkScene.classList.add("is-mixing");
      drawButton.disabled = true;
      drawButton.textContent = "小球搅动中…";
      drinkResult.textContent = "灯光亮起，今晚的答案正在靠近。";
      drawnBall.classList.remove("is-dropping");
      drawnBall.textContent = "开奖中";
      playStartSound();

      const rounds = reduceMotion ? 4 : 18;
      for (let i = 0; i < rounds; i += 1) {
        const preview = drinks[Math.floor(Math.random() * drinks.length)];
        drawnBall.textContent = preview.name;
        drawnBall.style.background = `radial-gradient(circle at 31% 25%, rgba(255,255,255,.95) 0 8%, transparent 9%), linear-gradient(145deg, ${preview.light}, ${preview.dark})`;
        playTick(450 + i * 19, 0.028);
        await wait(reduceMotion ? 15 : 90 + i * 7);
      }

      const winner = drinks[Math.floor(Math.random() * drinks.length)];
      drinkScene.classList.remove("is-mixing");
      drawnBall.textContent = winner.name;
      drawnBall.style.background = `radial-gradient(circle at 31% 25%, rgba(255,255,255,.95) 0 8%, transparent 9%), linear-gradient(145deg, ${winner.light}, ${winner.dark})`;
      void drawnBall.offsetWidth;
      drawnBall.classList.add("is-dropping");
      await wait(reduceMotion ? 20 : 760);

      drinkScene.classList.add("is-winning");
      drinkResult.innerHTML = `今晚抽中：<strong>${winner.name}</strong>`;
      drawButton.textContent = "再抽一次";
      drawButton.disabled = false;
      playWinSound();
      createConfetti();
      await wait(reduceMotion ? 30 : 330);
      openModal(winner);
      drawing = false;

      window.setTimeout(() => {
        drinkScene.classList.remove("is-winning");
      }, 4200);
    }

    drawButton.addEventListener("click", drawDrink);

    function openModal(winner) {
      winTitle.textContent = winner.name;
      winNote.textContent = winner.note;
      winGlass.textContent = winner.icon;
      winModal.classList.add("is-open");
      winModal.setAttribute("aria-hidden", "false");
      modalClose.focus();
    }

    function closeModal() {
      winModal.classList.remove("is-open");
      winModal.setAttribute("aria-hidden", "true");
    }

    modalClose.addEventListener("click", closeModal);
    acceptDrink.addEventListener("click", closeModal);
    drawAgain.addEventListener("click", () => {
      closeModal();
      drawDrink();
    });
    winModal.addEventListener("click", event => {
      if (event.target === winModal) closeModal();
    });
    document.addEventListener("keydown", event => {
      if (event.key === "Escape" && winModal.classList.contains("is-open")) closeModal();
    });

    function createConfetti() {
      if (reduceMotion) return;
      const colors = ["#ff718f", "#75e6dd", "#ffd56c", "#fff4dc", "#b696d8"];
      for (let i = 0; i < 46; i += 1) {
        const piece = document.createElement("i");
        piece.className = "confetti";
        piece.style.left = `${Math.random() * 100}vw`;
        piece.style.background = colors[i % colors.length];
        piece.style.setProperty("--drift", `${Math.round(Math.random() * 180 - 90)}px`);
        piece.style.setProperty("--fall-time", `${1.8 + Math.random() * 1.8}s`);
        piece.style.animationDelay = `${Math.random() * 0.5}s`;
        document.body.appendChild(piece);
        window.setTimeout(() => piece.remove(), 4300);
      }
    }

    function clearConfetti() {
      document.querySelectorAll(".confetti").forEach(piece => piece.remove());
    }

    /* Browser-generated sound effects */
    const soundToggle = document.getElementById("soundToggle");
    let soundEnabled = true;
    let audioContext = null;

    function initAudio() {
      if (!soundEnabled) return;
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (!AudioCtx) return;
      if (!audioContext) audioContext = new AudioCtx();
      if (audioContext.state === "suspended") audioContext.resume();
    }

    function tone(frequency, duration, delay = 0, volume = 0.04, type = "sine") {
      if (!soundEnabled) return;
      initAudio();
      if (!audioContext) return;

      const oscillator = audioContext.createOscillator();
      const gain = audioContext.createGain();
      const start = audioContext.currentTime + delay;
      oscillator.type = type;
      oscillator.frequency.setValueAtTime(frequency, start);
      gain.gain.setValueAtTime(0.0001, start);
      gain.gain.exponentialRampToValueAtTime(volume, start + 0.012);
      gain.gain.exponentialRampToValueAtTime(0.0001, start + duration);
      oscillator.connect(gain);
      gain.connect(audioContext.destination);
      oscillator.start(start);
      oscillator.stop(start + duration + 0.02);
    }

    function playTick(frequency = 520, volume = 0.025) {
      tone(frequency, 0.055, 0, volume, "square");
    }

    function playStartSound() {
      tone(220, 0.12, 0, 0.035, "triangle");
      tone(330, 0.12, 0.09, 0.035, "triangle");
      tone(440, 0.16, 0.18, 0.04, "triangle");
    }

    function playSoftWin() {
      tone(523.25, 0.18, 0, 0.035, "sine");
      tone(659.25, 0.18, 0.12, 0.035, "sine");
      tone(783.99, 0.28, 0.24, 0.04, "sine");
    }

    function playWinSound() {
      const notes = [392, 523.25, 659.25, 783.99, 1046.5];
      notes.forEach((note, index) => tone(note, index === notes.length - 1 ? 0.5 : 0.22, index * 0.11, 0.055, "triangle"));
      tone(196, 0.5, 0.04, 0.025, "sine");
    }

    soundToggle.addEventListener("click", () => {
      soundEnabled = !soundEnabled;
      soundToggle.setAttribute("aria-pressed", String(soundEnabled));
      soundToggle.querySelector(".sound-icon").textContent = soundEnabled ? "🔊" : "🔇";
      soundToggle.querySelector(".sound-label").textContent = soundEnabled ? "音效开启" : "音效关闭";
      soundToggle.title = soundEnabled ? "关闭音效" : "开启音效";
      if (soundEnabled) {
        initAudio();
        tone(660, 0.1, 0, 0.035, "sine");
      }
    });
  </script>
</body>
</html>

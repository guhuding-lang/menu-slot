<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050a0f">
  <meta name="description" content="沿着半圆轨道，挑选下一份旅行攻略。">
  <title>旅途收藏夹 · 旅行攻略</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #f4f8fb;
      --muted: #84919d;
      --faint: #53616d;
      --aqua: #86c5ff;
      --orange: #ffa62b;
      --bg: #050a0f;
      --panel: rgba(25, 37, 48, .44);
      --line: rgba(206, 228, 242, .22);
      --ease: cubic-bezier(.2, .8, .2, 1);
    }

    * { box-sizing: border-box; }
    html, body { width: 100%; min-height: 100%; margin: 0; }
    html { background: var(--bg); }
    body {
      overflow: hidden;
      min-height: 100svh;
      background:
        radial-gradient(70vw 70vw at 50% 48%, rgba(20, 58, 82, .18), transparent 65%),
        radial-gradient(42vw 42vw at 82% 4%, rgba(134, 197, 255, .07), transparent 60%),
        linear-gradient(145deg, #07111a 0%, #050a0f 56%, #03070b 100%);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI",
        "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      -webkit-font-smoothing: antialiased;
      user-select: none;
    }

    button, a { -webkit-tap-highlight-color: transparent; }
    button { font: inherit; }
    button:focus-visible, a:focus-visible {
      outline: 2px solid var(--aqua);
      outline-offset: 5px;
    }

    .app {
      position: relative;
      isolation: isolate;
      width: 100%;
      height: 100svh;
      min-height: 640px;
      overflow: hidden;
    }

    .app::before {
      content: "";
      position: absolute;
      z-index: -2;
      inset: 0;
      opacity: .22;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(255,255,255,.018) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.014) 1px, transparent 1px);
      background-size: 42px 42px;
      mask-image: linear-gradient(to bottom, #000, transparent 88%);
    }

    .app::after {
      content: "";
      position: absolute;
      z-index: -1;
      width: min(900px, 74vw);
      height: min(900px, 74vw);
      left: 50%;
      bottom: -68%;
      translate: -50% 0;
      border: 1px solid rgba(134, 197, 255, .09);
      border-radius: 50%;
      box-shadow:
        0 0 90px rgba(134, 197, 255, .035),
        inset 0 0 90px rgba(134, 197, 255, .018);
      pointer-events: none;
    }

    .topbar {
      position: relative;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 82px;
      padding: max(20px, env(safe-area-inset-top)) clamp(24px, 4vw, 64px) 0;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 13px;
      color: var(--ink);
      text-decoration: none;
      letter-spacing: .12em;
      font-family: ui-serif, "Songti SC", "STSong", serif;
      font-size: 15px;
      font-weight: 600;
    }

    .brand-mark {
      position: relative;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background:
        radial-gradient(circle at 38% 30%, rgba(255,255,255,.95) 0 18%, transparent 19%),
        linear-gradient(145deg, rgba(255,255,255,.98), rgba(190,219,236,.74));
      box-shadow: 0 0 22px rgba(134,197,255,.16);
    }
    .brand-mark::after {
      content: "";
      position: absolute;
      width: 33px;
      height: 10px;
      left: -4px;
      bottom: -2px;
      border-radius: 50%;
      background: #f7fbfd;
      transform: rotate(-8deg);
    }

    .count {
      display: flex;
      align-items: center;
      gap: 12px;
      color: var(--muted);
      font-size: 11px;
      letter-spacing: .2em;
      text-transform: uppercase;
    }
    .count strong {
      color: var(--ink);
      font-size: 14px;
      letter-spacing: .08em;
      font-weight: 500;
    }
    .count-line { width: 28px; height: 1px; background: rgba(255,255,255,.2); }

    .orbit {
      position: absolute;
      z-index: 5;
      inset: 82px 0 0;
      touch-action: none;
      cursor: grab;
    }
    .orbit.is-dragging { cursor: grabbing; }

    .guide-card {
      --x: 50vw;
      --y: 38vh;
      --scale: .76;
      --rotation: 0deg;
      --opacity: .5;
      --blur: 0px;
      --z: 1;
      position: absolute;
      z-index: var(--z);
      left: 0;
      top: 0;
      width: clamp(112px, 9.5vw, 156px);
      aspect-ratio: 1;
      padding: 0;
      border: 1px solid rgba(216, 235, 248, .24);
      border-radius: clamp(24px, 2.1vw, 34px);
      opacity: var(--opacity);
      overflow: hidden;
      background:
        linear-gradient(145deg, rgba(255,255,255,.105), rgba(255,255,255,.015) 48%, rgba(134,197,255,.04)),
        rgba(19, 28, 37, .44);
      box-shadow:
        0 22px 58px rgba(0, 0, 0, .38),
        inset 0 1px 0 rgba(255,255,255,.16),
        inset -12px -16px 28px rgba(0,0,0,.16);
      backdrop-filter: blur(15px) saturate(116%);
      -webkit-backdrop-filter: blur(15px) saturate(116%);
      transform: translate3d(var(--x), var(--y), 0) translate(-50%, -50%)
        rotate(var(--rotation)) scale(var(--scale));
      filter: blur(var(--blur));
      transition:
        transform 620ms var(--ease),
        opacity 420ms ease,
        filter 420ms ease,
        border-color 320ms ease,
        box-shadow 320ms ease;
      will-change: transform;
      color: var(--ink);
      cursor: pointer;
    }

    .orbit.is-dragging .guide-card { transition: none; }

    .guide-card::before {
      content: "";
      position: absolute;
      z-index: 3;
      inset: 1px;
      border-radius: inherit;
      pointer-events: none;
      background:
        linear-gradient(135deg, rgba(255,255,255,.12), transparent 28%),
        radial-gradient(circle at 22% 18%, rgba(255,255,255,.12), transparent 36%);
      mix-blend-mode: screen;
    }

    .guide-card::after {
      content: "";
      position: absolute;
      z-index: 1;
      inset: 14%;
      border-radius: 28%;
      border: 1px solid rgba(214,234,247,.09);
      background: linear-gradient(145deg, rgba(255,255,255,.025), rgba(0,0,0,.09));
    }

    .guide-card.is-active {
      border-color: rgba(180, 224, 255, .72);
      box-shadow:
        0 30px 80px rgba(0, 0, 0, .48),
        0 0 32px rgba(134, 197, 255, .16),
        inset 0 1px 0 rgba(255,255,255,.35);
    }

    .guide-card.has-guide::after { display: none; }

    .cover {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scale(1.015);
    }

    .cover-shade {
      position: absolute;
      z-index: 2;
      inset: 42% 0 0;
      background: linear-gradient(to bottom, transparent, rgba(2,7,11,.82));
      opacity: 0;
      transition: opacity 320ms ease;
    }
    .is-active .cover-shade { opacity: 1; }

    .card-copy {
      position: absolute;
      z-index: 4;
      left: 14px;
      right: 14px;
      bottom: 12px;
      text-align: left;
      opacity: 0;
      transform: translateY(5px);
      transition: opacity 280ms ease 100ms, transform 280ms ease 100ms;
      text-shadow: 0 2px 12px rgba(0,0,0,.8);
    }
    .is-active .card-copy { opacity: 1; transform: none; }
    .card-copy strong { display: block; font-size: 12px; font-weight: 650; }
    .card-copy small {
      display: block;
      margin-top: 3px;
      color: rgba(255,255,255,.72);
      font-size: 8px;
      letter-spacing: .06em;
    }

    .placeholder-index {
      position: absolute;
      z-index: 4;
      inset: auto 0 14px;
      color: rgba(225,239,247,.26);
      font-size: 9px;
      letter-spacing: .24em;
      text-align: center;
    }
    .is-active .placeholder-index { color: rgba(225,239,247,.52); }

    .hero-copy {
      position: absolute;
      z-index: 20;
      left: 50%;
      top: 68%;
      width: min(520px, 80vw);
      transform: translate(-50%, -50%);
      text-align: center;
      pointer-events: none;
    }

    .hero-copy h1 {
      margin: 0;
      font-family: ui-serif, "Songti SC", "STSong", serif;
      font-size: clamp(32px, 3.1vw, 54px);
      line-height: 1.16;
      letter-spacing: .09em;
      font-weight: 500;
      text-shadow: 0 8px 36px rgba(0,0,0,.7);
    }

    .hero-copy p {
      margin: 16px 0 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.75;
      letter-spacing: .08em;
    }

    .active-title {
      margin-top: 20px;
      min-height: 22px;
      color: rgba(229,241,249,.8);
      font-size: 11px;
      letter-spacing: .16em;
      transition: opacity 180ms ease;
    }
    .active-title b { color: var(--aqua); font-weight: 500; }

    .open-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-width: 118px;
      height: 42px;
      margin-top: 16px;
      padding: 0 18px;
      border: 1px solid rgba(173,216,245,.32);
      border-radius: 999px;
      background: rgba(133,197,255,.09);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.12), 0 12px 36px rgba(0,0,0,.2);
      color: #eef8ff;
      text-decoration: none;
      font-size: 11px;
      letter-spacing: .12em;
      pointer-events: auto;
      transition: background 220ms ease, border-color 220ms ease, opacity 220ms ease;
    }
    .open-link:hover { background: rgba(133,197,255,.16); border-color: rgba(173,216,245,.58); }
    .open-link[aria-disabled="true"] { opacity: .32; pointer-events: none; }
    .open-link svg { width: 14px; height: 14px; }

    .arrow {
      position: absolute;
      z-index: 60;
      top: 49%;
      width: 52px;
      height: 52px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(210,232,246,.18);
      border-radius: 50%;
      background: rgba(15, 25, 34, .48);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.08), 0 14px 36px rgba(0,0,0,.26);
      backdrop-filter: blur(12px);
      color: var(--ink);
      cursor: pointer;
      transition: background 180ms ease, border-color 180ms ease, transform 180ms ease;
    }
    .arrow:hover { background: rgba(29,48,62,.72); border-color: rgba(210,232,246,.34); }
    .arrow:active { transform: scale(.96); }
    .arrow svg { width: 20px; height: 20px; }
    .arrow.prev { left: clamp(18px, 3vw, 48px); }
    .arrow.next { right: clamp(18px, 3vw, 48px); }

    .gesture-hint {
      position: absolute;
      z-index: 30;
      left: 50%;
      bottom: max(22px, env(safe-area-inset-bottom));
      translate: -50% 0;
      display: flex;
      align-items: center;
      gap: 10px;
      color: rgba(194,216,230,.44);
      font-size: 9px;
      letter-spacing: .16em;
      text-transform: uppercase;
      pointer-events: none;
    }
    .gesture-hint svg { width: 18px; height: 18px; animation: hint 2.4s var(--ease) infinite; }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0,0,0,0);
      white-space: nowrap;
      border: 0;
    }

    @keyframes hint {
      0%, 100% { transform: translateX(-3px); opacity: .4; }
      50% { transform: translateX(3px); opacity: .9; }
    }

    @media (max-width: 760px) {
      body {
        background:
          radial-gradient(100vw 72vh at 28% 48%, rgba(23,70,98,.2), transparent 70%),
          linear-gradient(155deg, #07111a 0%, #050a0f 58%, #03070b 100%);
      }
      .app { min-height: 560px; }
      .app::before { background-size: 32px 32px; opacity: .14; }
      .app::after {
        width: 150vw;
        height: 150vw;
        left: -118vw;
        bottom: auto;
        top: 49%;
        translate: 0 -50%;
      }
      .topbar {
        height: 70px;
        padding: max(17px, env(safe-area-inset-top)) 18px 0;
      }
      .brand { gap: 10px; font-size: 13px; letter-spacing: .08em; }
      .brand-mark { width: 23px; height: 23px; }
      .brand-mark::after { width: 27px; height: 8px; }
      .count span, .count-line { display: none; }
      .count strong { font-size: 12px; color: rgba(236,245,250,.7); }

      .orbit { inset: 70px 0 0; }
      .guide-card {
        width: clamp(100px, 29vw, 128px);
        border-radius: 27px;
      }
      .card-copy { left: 11px; right: 11px; bottom: 10px; }
      .card-copy strong { font-size: 10px; }
      .card-copy small { font-size: 7px; }

      .hero-copy {
        left: auto;
        right: 24px;
        top: auto;
        bottom: max(62px, calc(env(safe-area-inset-bottom) + 52px));
        width: min(220px, 58vw);
        transform: none;
        text-align: right;
      }
      .hero-copy h1 { font-size: clamp(26px, 8.2vw, 34px); letter-spacing: .07em; }
      .hero-copy p { margin-top: 9px; font-size: 10px; line-height: 1.65; letter-spacing: .04em; }
      .active-title { margin-top: 12px; font-size: 9px; line-height: 1.5; letter-spacing: .08em; }
      .open-link { height: 40px; min-width: 108px; margin-top: 11px; font-size: 10px; }

      .arrow {
        top: 50%;
        width: 44px;
        height: 44px;
      }
      .arrow.prev { left: 12px; transform: translateY(-56px) rotate(90deg); }
      .arrow.next { left: 12px; right: auto; transform: translateY(56px) rotate(90deg); }
      .arrow.prev:active { transform: translateY(-56px) rotate(90deg) scale(.96); }
      .arrow.next:active { transform: translateY(56px) rotate(90deg) scale(.96); }
      .gesture-hint {
        left: 18px;
        bottom: max(20px, env(safe-area-inset-bottom));
        translate: 0 0;
        flex-direction: column;
        gap: 4px;
        writing-mode: vertical-rl;
        font-size: 8px;
      }
      .gesture-hint svg { transform: rotate(90deg); animation-name: hint-y; }
    }

    @media (max-width: 380px) {
      .hero-copy { right: 18px; width: 56vw; }
      .hero-copy h1 { font-size: 25px; }
      .guide-card { width: 104px; border-radius: 23px; }
    }

    @media (max-height: 680px) and (max-width: 760px) {
      .hero-copy { bottom: max(38px, calc(env(safe-area-inset-bottom) + 32px)); }
      .hero-copy p { display: none; }
      .active-title { margin-top: 8px; }
      .open-link { margin-top: 8px; }
    }

    @media (orientation: landscape) and (max-height: 560px) {
      .topbar { height: 58px; padding-top: max(12px, env(safe-area-inset-top)); }
      .orbit { inset-top: 58px; }
      .hero-copy { top: 66%; bottom: auto; right: 6vw; width: 36vw; }
      .hero-copy h1 { font-size: 25px; }
      .gesture-hint { display: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        animation-duration: .001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .001ms !important;
      }
    }

    @keyframes hint-y {
      0%, 100% { transform: rotate(90deg) translateX(-3px); opacity: .4; }
      50% { transform: rotate(90deg) translateX(3px); opacity: .9; }
    }
  </style>
</head>
<body>

    <header class="topbar">
      <a class="brand" href="./" aria-label="旅途收藏夹首页">
        <span class="brand-mark" aria-hidden="true"></span>
        <span>旅途收藏夹</span>
      </a>
      <div class="count" aria-live="polite">
        <span>Travel guides</span>
        <i class="count-line" aria-hidden="true"></i>
        <strong id="count">01 / 09</strong>

      <span>滑动选择</span>
    </div>
    <p class="sr-only" id="status" aria-live="polite">当前选择济州岛六天五晚攻略</p>
  </main>

  <script>
    (() => {
      const cards = [...document.querySelectorAll('.guide-card')];
      const orbit = document.getElementById('orbit');
      const prev = document.getElementById('prev');
      const next = document.getElementById('next');
      const count = document.getElementById('count');
      const activeTitle = document.getElementById('activeTitle');
      const openLink = document.getElementById('openLink');
      const status = document.getElementById('status');
      const total = cards.length;
      const guideUrl = '../jeju-guide/';
      let active = 0;
      let dragProgress = 0;
      let startPoint = 0;
      let dragging = false;
      let moved = false;
      let wheelLock = false;

      const isMobile = () => matchMedia('(max-width: 760px)').matches;
      const mod = (value, base) => ((value % base) + base) % base;
      const circularDiff = (index, position) => {
        let diff = mod(index - position + total / 2, total) - total / 2;
        if (diff <= -total / 2) diff += total;
        return diff;
      };

      function render(animate = true) {
        orbit.classList.toggle('is-dragging', !animate);
        const mobile = isMobile();
        const position = active + dragProgress;
        const width = window.innerWidth;
        const height = window.innerHeight - (mobile ? 70 : 82);
        const centerX = mobile ? -width * .25 : width * .5;
        const centerY = mobile ? height * .47 : height * 1.02;
        const radius = mobile
          ? Math.min(width * .76, 330)
          : Math.min(width * .39, height * .72, 610);
        const step = mobile ? 27 : 21.5;

        cards.forEach((card, index) => {
          const diff = circularDiff(index, position);
          const angle = (mobile ? diff * step : -90 + diff * step) * Math.PI / 180;
          const x = centerX + Math.cos(angle) * radius;
          const y = centerY + Math.sin(angle) * radius;
          const distance = Math.abs(diff);
          const scale = Math.max(.58, 1.25 - distance * .13);
          const opacity = Math.max(.18, 1 - distance * .16);
          const rotation = mobile ? diff * 8 : diff * 7.5;
          const blur = distance > 3.2 ? Math.min(2.2, (distance - 3.2) * 1.2) : 0;
          card.style.setProperty('--x', x + 'px');
          card.style.setProperty('--y', y + 'px');
          card.style.setProperty('--scale', scale.toFixed(3));
          card.style.setProperty('--rotation', rotation.toFixed(2) + 'deg');
          card.style.setProperty('--opacity', opacity.toFixed(3));
          card.style.setProperty('--blur', blur.toFixed(2) + 'px');
          card.style.setProperty('--z', String(100 - Math.round(distance * 10)));
          card.classList.toggle('is-active', distance < .45);
          card.setAttribute('aria-current', distance < .45 ? 'true' : 'false');
          card.tabIndex = distance < .45 ? 0 : -1;
        });
      }

      function updateCopy() {
        const hasGuide = active === 0;
        count.textContent = String(active + 1).padStart(2, '0') + ' / ' + String(total).padStart(2, '0');
        activeTitle.innerHTML = hasGuide ? '济州岛 · <b>六天五晚</b>' : '新的目的地 · <b>正在计划</b>';
        openLink.href = hasGuide ? guideUrl : '#';
        openLink.setAttribute('aria-disabled', hasGuide ? 'false' : 'true');
        openLink.setAttribute('aria-label', hasGuide ? '进入济州岛六天五晚攻略' : '这份攻略正在计划中');
        openLink.querySelector('span').textContent = hasGuide ? '进入攻略' : '暂未开放';
        status.textContent = hasGuide ? '当前选择济州岛六天五晚攻略' : '当前选择待规划攻略 ' + String(active + 1).padStart(2, '0');
      }

      function select(index, direction = 0) {
        active = mod(index, total);
        dragProgress = 0;
        render(true);
        updateCopy();
        if (direction !== 0 && navigator.vibrate) navigator.vibrate(8);
      }

      function step(direction) { select(active + direction, direction); }

      prev.addEventListener('click', () => step(-1));
      next.addEventListener('click', () => step(1));

      cards.forEach((card, index) => {
        card.addEventListener('click', () => {
          if (moved) return;
          if (index !== active) return select(index);
          if (index === 0) window.location.href = guideUrl;
        });
      });

      orbit.addEventListener('pointerdown', (event) => {
        if (event.button !== 0) return;
        dragging = true;
        moved = false;
        startPoint = isMobile() ? event.clientY : event.clientX;
        orbit.setPointerCapture(event.pointerId);
      });

      orbit.addEventListener('pointermove', (event) => {
        if (!dragging) return;
        const point = isMobile() ? event.clientY : event.clientX;
        const delta = point - startPoint;
        if (Math.abs(delta) > 5) moved = true;
        dragProgress = -delta / (isMobile() ? 86 : 110);
        render(false);
      });

      function endDrag(event) {
        if (!dragging) return;
        dragging = false;
        if (orbit.hasPointerCapture(event.pointerId)) orbit.releasePointerCapture(event.pointerId);
        const steps = Math.round(dragProgress);
        select(active + steps, steps);
        requestAnimationFrame(() => { orbit.classList.remove('is-dragging'); });
        setTimeout(() => { moved = false; }, 40);
      }
      orbit.addEventListener('pointerup', endDrag);
      orbit.addEventListener('pointercancel', endDrag);

      orbit.addEventListener('wheel', (event) => {
        event.preventDefault();
        if (wheelLock) return;
        const delta = isMobile() ? event.deltaY : (Math.abs(event.deltaX) > Math.abs(event.deltaY) ? event.deltaX : event.deltaY);
        if (Math.abs(delta) < 4) return;
        wheelLock = true;
        step(delta > 0 ? 1 : -1);
        setTimeout(() => { wheelLock = false; }, 420);
      }, { passive: false });

      document.addEventListener('keydown', (event) => {
        if (['ArrowRight', 'ArrowDown'].includes(event.key)) { event.preventDefault(); step(1); }
        if (['ArrowLeft', 'ArrowUp'].includes(event.key)) { event.preventDefault(); step(-1); }
        if (event.key === 'Enter' && active === 0 && document.activeElement === cards[0]) window.location.href = guideUrl;
      });

      let resizeFrame = 0;
      window.addEventListener('resize', () => {
        cancelAnimationFrame(resizeFrame);
        resizeFrame = requestAnimationFrame(() => render(false));
      });

      render(true);
      updateCopy();
    })();
  </script>
</body>
</html>
